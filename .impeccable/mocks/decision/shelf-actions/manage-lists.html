<!doctype html>
<html lang="en" data-mode="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manage your lists</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="kit.css">
<script src="kit.js"></script>
<style>
/* ---------- the Completed page today: year heading, reel, year rail ---------- */
.cwrap{display:grid;grid-template-columns:minmax(0,1fr) 5rem;gap:28px;margin-top:24px}
.yhd{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.yhd h2{font:400 2.5rem/.9 Anton;text-transform:uppercase}
.yhd h2 small{font:800 .84rem/1 "Barlow Condensed";letter-spacing:.08em;color:var(--faint);margin-left:12px;vertical-align:middle}
.yrail{border-left:1px solid var(--border);padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px;align-self:start}
.yrail .all{font:800 .8rem/1 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:5px 0;width:56px;text-align:center;border-radius:3px;margin-bottom:4px}
.yrail .y{font:400 1.25rem/1 Anton;color:var(--faint);margin:8px 0 4px}
.yrail .y.on{color:var(--fg)}
.yrail .m{font:800 .8rem/1 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--dim);width:48px;text-align:center;padding:3px 0}
.yrail .m.off{color:var(--bs)}
.yrail .nd{font:400 1rem/1 Anton;color:var(--faint);margin-top:8px;text-transform:uppercase}
.yrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.yrow span{font:400 1.15rem/1 Anton;color:var(--faint);padding:6px 8px;border-radius:3px}
.yrow span.on{background:var(--fg);color:var(--bg)}
.spot{position:relative;isolation:isolate;display:grid;grid-template-columns:180px minmax(0,1fr) auto;gap:30px;align-items:end;padding:30px;border-radius:3.2px;overflow:visible;background:#000;min-height:380px}
.spot>.art{z-index:-2;border-radius:3.2px;background-position:50% 30%}
.spot::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:3.2px;background:linear-gradient(90deg,rgb(11 11 13/.94) 0%,rgb(11 11 13/.8) 45%,rgb(11 11 13/.35) 100%),linear-gradient(0deg,rgb(11 11 13/.85),transparent 55%)}
.spot .cv{box-shadow:0 14px 34px rgb(0 0 0/.55)}
.spot h2{font:400 4.6rem/.88 Anton;text-transform:uppercase;max-width:14ch}
.spot dl{display:flex;flex-wrap:wrap;gap:12px 26px;margin:18px 0 0}
.spot dl div{display:flex;flex-direction:column-reverse;gap:4px}
.spot dt{font:800 .8rem/1 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.spot dd{margin:0;font:400 2.4rem/.85 Anton;text-transform:uppercase}
.spot blockquote{margin:16px 0 0;font-style:italic;max-width:52ch}
.spot blockquote small{display:block;font:800 .72rem/1 "Barlow Condensed";letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-style:normal;margin-top:5px}
.spot .ctl{display:flex;flex-direction:column;align-items:flex-end;gap:10px;align-self:stretch;justify-content:space-between}
.spot .ctl .pos{font:800 .8rem/1 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:flex;gap:6px;align-items:center}
.spot.editing{box-shadow:0 0 0 2px var(--hl)}
.spot .ef{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px;margin-top:16px;max-width:760px}
.spot .ef .fld{background:rgb(11 11 13/.82)}
.spot .ef .wide2{grid-column:span 2}
.spot .ef .all3{grid-column:1/-1}
.spot .ebar{display:flex;gap:8px;margin-top:16px;align-items:center}
.spot .ebar .btn.ds{margin-right:auto;background:rgb(11 11 13/.7)}
.strip{display:flex;gap:22px;margin-top:26px;padding-top:12px;overflow:hidden}
.strip section{display:flex;flex-direction:column;gap:10px;flex:none}
.strip h3{font:800 .84rem/1 "Barlow Condensed";letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--border);padding-bottom:6px}
.strip h3 b{color:var(--fg);margin-right:6px}
.strip ul{display:flex;gap:8px}
.strip li{width:104px;position:relative}
.strip li .t{font:700 .8rem/1.15 "Barlow Condensed";margin-top:6px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.strip li.on .cv{box-shadow:0 0 0 3px var(--fg)}
.strip li.on::before{content:"";position:absolute;top:-14px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--fg)}
.strip li.on .t{color:var(--fg)}
.strip li.hole .cv{background:transparent;box-shadow:none;outline:1.5px dashed var(--dest);outline-offset:-1.5px;display:grid;place-items:center}
.strip li.hole .cv::after{display:none}
.strip li.hole .t{color:var(--dest);text-decoration:line-through}
.strip li .x{position:absolute;top:4px;right:4px;z-index:2;width:26px;height:26px;border-radius:2.4px;background:rgb(11 11 13/.82);display:grid;place-items:center;color:var(--dim)}
.strip li .x svg.lucide{width:14px;height:14px}
.pshell .cwrap{display:block;margin-top:16px}
.pshell .yhd h2{font-size:1.9rem}
.pshell .spot{grid-template-columns:minmax(0,1fr);padding:18px;gap:14px;min-height:0}
.pshell .spot .cv{width:110px!important}
.pshell .spot h2{font-size:2.5rem}
.pshell .spot dd{font-size:1.8rem}
.pshell .spot .ef{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pshell .spot .ef .all3,.pshell .spot .ef .wide2{grid-column:1/-1}
.pshell .spot .ctl{flex-direction:row;align-items:center}
.pshell .strip{flex-direction:column}
.pshell .strip ul{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.pshell .strip li{width:auto}

/* list grid (Backlog) */
.bgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:22px 14px;margin-top:22px}
.gc{position:relative;min-width:0}
.gc .num{position:absolute;top:-14px;left:4px;z-index:3;font:400 3.1rem/1 Anton;color:var(--fg);-webkit-text-stroke:6px var(--bg);paint-order:stroke fill}
.gc .cv{width:100%!important}
.gc b{display:block;font:700 .97rem/1.15 "Barlow Condensed";letter-spacing:.02em;margin-top:9px}
.gc small{display:block;font:700 .78rem/1.2 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.gc q{display:block;font-style:italic;font-size:.82rem;color:var(--dim);margin-top:5px;quotes:"\201C" "\201D"}
.gc.lift{transform:translateY(-10px) rotate(-1.5deg);z-index:5}
.gc.lift .cv{box-shadow:0 0 0 3px var(--hl),0 18px 34px rgb(0 0 0/.6)}
.gc.ghost .cv{opacity:.3}
.gc.ghost{opacity:.6}
.gc.slotgap{border:2px dashed var(--hl);border-radius:3px;background:rgb(255 212 0/.06);display:grid;place-items:center;align-content:center;gap:6px;color:var(--hl);font:800 .8rem/1 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;min-height:200px}
.liftbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);box-shadow:inset 0 0 0 1px var(--hl);border-radius:3px;padding:10px 12px;margin-top:20px}
.liftbar b{font:400 1.2rem/1 Anton;text-transform:uppercase}
.liftbar .lb{color:var(--dim)}
.liftbar .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:2px;box-shadow:inset 0 0 0 1px var(--bs);font:700 .74rem/1 "Barlow Condensed";color:var(--fg)}
.pshell .bgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 10px}
.pshell .gc .num{font-size:2.3rem}

/* ---------- 3B the ledger ---------- */
.lg{width:100%;border-collapse:collapse;table-layout:fixed}
.lg th{font:800 .74rem/1 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:left;padding:8px 10px;border-bottom:1px solid var(--bs)}
.lg td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:.92rem;color:var(--dim)}
.lg td.g{color:var(--fg);font-weight:600}
.lg td.g .w{display:flex;align-items:center;gap:12px}
.lg .fld.sm{padding:0 8px;gap:6px}
.lg td.n{font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg td.d{white-space:nowrap;font-variant-numeric:tabular-nums}
.lg td.tl2{white-space:nowrap;text-align:right}
.lg tr.mh td{font:800 .78rem/1 "Barlow Condensed";letter-spacing:.1em;text-transform:uppercase;color:var(--fg);padding:16px 10px 6px;border-bottom:1px solid var(--bs)}
.lg tr.mh td span{color:var(--faint);margin-left:6px}
.lg tr.ed td{background:rgb(255 212 0/.04);border-bottom:0;padding-top:10px;padding-bottom:10px}
.lg tr.ed td:first-child{box-shadow:inset 2px 0 0 var(--hl)}
.rowform{display:grid;grid-template-columns:1.5fr 1fr 1.2fr 1.2fr .6fr;gap:10px 10px;align-items:end}
.rowform .nt{grid-column:1/4}
.rowform .bb{grid-column:4/-1;display:flex;gap:6px;justify-content:flex-end}
.lg tr.ed2 td{background:rgb(255 212 0/.04);padding-top:0;padding-bottom:12px}
.lg tr.ed2 td:first-child{box-shadow:inset 2px 0 0 var(--hl)}
.lg tr.rm td{color:var(--faint)}
.lg tr.rm td.g{color:var(--dest);text-decoration:line-through}
.lg tr.rm td.g .cv{opacity:.35}
.lg tr.rm td.tl2{text-decoration:none}
.lg tr.drain td{padding:0;border-bottom:1px solid var(--border);height:3px;background:linear-gradient(90deg,var(--dest) 58%,transparent 58%)}
.lg .rk2{font:400 1.6rem/.9 Anton;color:var(--fg);width:30px;text-align:right}
.lg tr.drag td{background:var(--muted)}
.lg tr.drag td:first-child{box-shadow:inset 2px 0 0 var(--hl)}
.lg tr.dropl td{padding:0;height:3px;background:var(--hl);border:0;position:relative}
.ltool{display:flex;gap:4px;justify-content:flex-end}
.addrow{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.addrow .fld{flex:1;max-width:520px}
.ledhd{display:flex;align-items:baseline;gap:12px;margin:6px 0 0;border-bottom:2px solid var(--fg);padding-bottom:6px}
.ledhd h2{font:400 2.2rem/.9 Anton;text-transform:uppercase}
.ledhd .r{margin-left:auto;font:800 .78rem/1 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--hl)}
.editbar{display:flex;align-items:center;gap:10px;background:var(--card);box-shadow:inset 0 0 0 1px var(--hl);border-radius:3px;padding:10px 14px;margin-bottom:18px;font-size:.92rem;color:var(--dim)}
.editbar b{color:var(--fg)}
.editbar svg.lucide{color:var(--hl)}
.prow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.prow b{font-weight:600;display:block;line-height:1.2}
.prow small{font:700 .74rem/1.25 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.prow.ed{background:rgb(255 212 0/.04);box-shadow:inset 2px 0 0 var(--hl);padding-left:10px;padding-right:8px;margin:0 -8px 0 -10px}
.prow .eform{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:8px}
.prow .eform .full{grid-column:1/-1}

/* ---------- 3C cards with tools ---------- */
.mg{margin-top:26px}
.mg>h3{display:flex;align-items:baseline;gap:8px;font:800 .84rem/1 "Barlow Condensed";letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:14px}
.mg>h3 b{color:var(--fg)}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:20px 14px}
.cc{position:relative;min-width:0}
.cc .cv{width:100%!important}
.cc .more{position:absolute;top:6px;right:6px;z-index:3;width:28px;height:28px;border-radius:2.4px;background:rgb(11 11 13/.82);display:grid;place-items:center;color:var(--fg);box-shadow:inset 0 0 0 1px rgb(244 244 240/.2)}
.cc .more svg.lucide{width:16px;height:16px}
.cc .more.on{box-shadow:inset 0 0 0 2px var(--hl);color:var(--hl)}
.cc b{display:block;font:700 .95rem/1.15 "Barlow Condensed";margin-top:8px;letter-spacing:.02em}
.cc small{display:block;font:700 .74rem/1.25 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:3px}
.cc.sel .cv{box-shadow:0 0 0 3px var(--hl)}
.cc.addt .cv{background:transparent;outline:1.5px dashed var(--bs);outline-offset:-1.5px;display:grid;place-items:center;align-content:center;gap:6px;color:var(--dim);font:800 .84rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;text-align:center}
.cc.addt .cv::after{display:none}
.cc.addt.on .cv{outline-color:var(--hl);color:var(--hl)}
.cc.gone .cv{background:transparent;outline:1.5px dashed var(--dest);outline-offset:-1.5px;display:grid;place-items:center;align-content:center;gap:8px;color:var(--dest);text-align:center;padding:8px}
.cc.gone .cv::after{display:none}
.cc.gone .cv span{font:800 .76rem/1.2 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase}
.cc.gone b{color:var(--faint);text-decoration:line-through}
.cmenu{width:230px;padding:6px}
.cmenu .o{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:2.4px;font:800 .86rem/1 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase}
.cmenu .o svg.lucide{width:16px;height:16px;color:var(--faint)}
.cmenu .o.hov{background:var(--muted)}
.cmenu .o.dz{color:var(--dest)}
.cmenu .o.dz svg.lucide{color:var(--dest)}
.cmenu hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.live{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--dim);margin-top:14px}
.live svg.lucide{width:16px;height:16px;color:var(--hl)}
.pshell .cgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px}

/* ---------- 4 /edit trimmed ---------- */
.esec{display:grid;grid-template-columns:15rem minmax(0,1fr);gap:36px;margin-top:24px}
.enav a{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 12px;border-radius:2.4px;font:800 1.05rem/1 "Barlow Condensed";letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
.enav a.on{background:var(--fg);color:var(--bg)}
.enav a b{font:400 1.05rem/1 Anton;color:var(--faint)}
.enav .imp{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.enav .imp a{color:var(--fg)}
.enav .lists{margin-top:18px;border-top:1px solid var(--border);padding-top:12px}
.enav .lists p{font:800 .78rem/1 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 12px 8px}
.enav .lists a{height:34px;font-size:.92rem;color:var(--faint)}
.soc{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px 18px;align-items:center;max-width:720px}
.soc .k{display:flex;align-items:center;gap:8px;font:800 .9rem/1 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.pshell .esec{grid-template-columns:minmax(0,1fr);gap:16px}
.pshell .enav{display:flex;gap:6px;overflow:hidden}
.pshell .enav a{height:36px;font-size:.92rem;background:var(--card);white-space:nowrap}
.pshell .enav a.on{background:var(--fg)}
.pshell .enav .imp{margin:0;border:0;padding:0}
.pshell .soc{grid-template-columns:minmax(0,1fr);gap:6px}
.pshell .soc .fld{margin-bottom:8px}
</style></head>
<body>
<script>
/* ---------- data ---------- */
const DONE = [
  ["e33", "Nov", "18 Nov 2026", "Main Story + Side Content", "PS5", "20 Sep 2026", 61, "The Gommage. Still thinking about it."],
  ["hades", "Nov", "3 Nov 2026", "Main Story", "PC", "2 Oct 2026", 22, ""],
  ["liesofp", "Oct", "27 Oct 2026", "Main Story", "PS5", "1 Oct 2026", 41, "Best boss in the genre is a puppet."],
  ["ff7rb", "Oct", "12 Oct 2026", "Main Story + Side Content", "PS5", "4 Aug 2026", 88, ""],
  ["sos", "Sep", "21 Sep 2026", "Main Story", "Switch", "2 Sep 2026", 29, "Coop with Jun on the couch."],
  ["wukong", "Aug", "30 Aug 2026", "Main Story", "PC", "8 Aug 2026", 44, ""],
  ["octo", "Jul", "19 Jul 2026", "Main Story", "Switch", "3 May 2026", 70, ""],
  ["p5r", "Jun", "2 Jun 2026", "Completionist", "PS5", "1 Feb 2026", 132, "Every confidant. Never again. Until next time."],
  ["outer", "Apr", "14 Apr 2026", "Main Story", "PC", "", 19, "Go in blind."],
  ["dq11", "Feb", "8 Feb 2026", "Main Story + Side Content", "Switch", "2 Dec 2025", 96, ""],
  ["disco", "Jan", "11 Jan 2026", "Main Story", "PC", "28 Dec 2025", 31, ""],
];
const MON = { Nov: "November", Oct: "October", Sep: "September", Aug: "August", Jul: "July", Jun: "June", Apr: "April", Feb: "February", Jan: "January" };
const byMonth = () => { const m = []; DONE.forEach((d) => { let g = m.find((x) => x.k === d[1]); if (!g) m.push((g = { k: d[1], items: [] })); g.items.push(d); }); return m; };
const shortType = (t) => ({ "Main Story": "Main", "Main Story + Side Content": "Main + Side", Completionist: "Completionist" })[t];
const BACKLOG = [["wolong", "Switch", "Before Wuchang, apparently.", "3 Feb"], ["wuchang", "PS5", "", "9 Aug"], ["liesofp2", null], ["nioh2", "PC", "Pairs with Wo Long.", "14 Mar"], ["ff12", "PS4", "", "1 Jan"], ["yakuza0", "PC", "Everyone says start here.", "20 Feb"], ["bg3", "PC", "", "2 Sep"], ["ff7r", "PS5", "", "12 Apr"], ["metaphor", "PS5", "For the club round.", "11 Nov"], ["elden", "PC", "", "5 May"], ["trails", "Switch", "", "30 Oct"], ["xeno", "Switch", "", "7 Jun"]].filter((b) => b[1] !== null);
const PLATS = ["PS5", "PC", "Switch"];

/* ---------- the list page head (MemberListTemplate) ---------- */
const lhead = (cur, o = {}) => {
  const L = LISTS5.map((l) => `<li class="${l.k === cur ? "on" : ""}">${l.n}<b>${COUNTS[l.k]}</b></li>`).join("");
  const title = LISTS5.find((l) => l.k === cur).n;
  return `${o.ph ? `<span class="pback">${ic("arrow-left")}</span>` : `<span class="back">${ic("arrow-left")}Mara</span>`}
  <div class="mhd"><span class="who">${av("mara", 32)}Mara</span><ul>${L}</ul></div>
  <div class="hd"><h1>${title}</h1><span class="n lb">${COUNTS[cur]} games</span><div class="act">${o.act || ""}</div></div>`;
};
const yrail = () => `<nav class="yrail"><span class="all">All</span><span class="y on">2026</span>${["Nov", "Oct", "Sep", "Aug", "Jul", "Jun", "May", "Apr", "Mar", "Feb", "Jan"].map((m) => `<span class="m ${["May", "Mar"].includes(m) ? "off" : ""}">${m}</span>`).join("")}${[2025, 2024, 2023, 2022, 2021, 2020, 2019].map((y) => `<span class="y">${y}</span>`).join("")}<span class="nd">No date</span></nav>`;
const yrow = `<div class="yrow"><span>All</span><span class="on">2026</span><span>2025</span><span>2024</span><span>2023</span><span>2022</span><span>2021</span><span>…</span></div>`;
const yhd = (o = {}) => `<div class="yhd"><h2>2026<small>${o.n ?? 11} games</small></h2>${o.r ?? fld("Search Mara's completed games", { i: "search", cls: "ph" })}</div>`;
const LOGBTN = `<span class="btn hl">${ic("flag")}Log a completion</span>`;

/* ---------- reel: spotlight + strip ---------- */
const spot = (d, o = {}) => {
  const [k, , end, type, plat, start, hrs, note] = d;
  const g = G[k];
  const view = `<h2>${esc(g.t)}</h2><dl><div><dt>Finished</dt><dd>${end.replace(" 2026", "")}</dd></div><div><dt>Type</dt><dd>${shortType(type)}</dd></div><div><dt>Platform</dt><dd>${plat}</dd></div><div><dt>Playtime</dt><dd>${hrs} h</dd></div></dl>${note ? `<blockquote>“${note}”<small>Mara's note</small></blockquote>` : ""}`;
  const cS = o.cal === "s" ? cal({ y: 2026, m: 9, sel: 20, today: 0, title: "Started", cls: o.ph ? "r" : "", foot: `<span class="tl">Only the month</span><span class="tl">Clear</span>` }) : "";
  const cF = o.cal === "f" ? cal({ sel: 18, today: 24, max: 24, title: "Finished", cls: "", foot: `<span class="tl">Only the month</span><span class="tl">Today</span>` }) : "";
  const edit = `<h2 style="font-size:${o.ph ? "2.3rem" : "3.4rem"}">${esc(g.t)}</h2><div class="ef">
    <div class="wide2">${lab("Completion")}${sel(type)}</div><div>${lab("Platform")}${sel("PlayStation 5")}</div>
    <div>${lab("Started", 1)}<span class="anc wide">${dateF(start, { open: o.cal === "s" })}${cS}</span></div><div>${lab("Finished")}<span class="anc wide">${dateF(end, { open: o.cal === "f" })}${cF}</span></div><div>${lab("Playtime", 1)}${fld(hrs + " h")}</div>
