<!doctype html>
<html lang="en" data-mode="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lists pages</title>
<meta name="description" content="Options for /lists, a Game List page with its inline editor, and /lists/new (www#168).">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="kit.css">
<script src="kit.js"></script>
<style>
/* ---------- shared on this page ---------- */
.states{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.states{grid-template-columns:minmax(0,1fr)}}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}
.ov .dlg{width:560px;max-width:100%}
.pshell .ov .dlg{width:100%;padding:18px}
.pshell .ov .dlg h3{font-size:1.55rem}
.dlg p{color:var(--dim);line-height:1.5}
.dlg p b{color:var(--fg);font-weight:600}
.dlg .bt{flex-wrap:wrap}
.byl{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-top:12px;color:var(--dim);font-size:.95rem}
.byl b{color:var(--fg);font-weight:600}
.byl .dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}
.desc{color:var(--dim);max-width:65ch;margin-top:8px}
.linked{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:2px;box-shadow:inset 0 0 0 1.5px var(--dim);font:700 .8rem/1 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;color:var(--fg)}
.linked svg.lucide{width:14px;height:14px}
.linked u{text-decoration-color:var(--gotm);text-decoration-thickness:2px;text-underline-offset:3px}
.tok{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 4px 0 3px;border-radius:2px;background:var(--fg);color:var(--bg);font:700 .82rem/1 "Barlow Condensed";letter-spacing:.05em;text-transform:uppercase}
.tok .cv{border-radius:1px}
.tok svg.lucide{width:13px;height:13px}
.ctr{font:700 .74rem/1 "Barlow Condensed";letter-spacing:.07em;color:var(--faint);text-transform:uppercase}
.ctr b{color:var(--hl);font-weight:700}
.rtools{display:flex;gap:2px;align-items:center}
.rtools .btn{box-shadow:none;color:var(--faint)}
.rtools .btn.x:hover{color:var(--dest)}
.editing{box-shadow:inset 0 0 0 1px var(--hl);border-radius:3.2px}

/* ================= 1A contents page ================= */
.a1-search{display:flex;gap:10px;margin-top:20px;align-items:center}
.a1-search .fld{flex:1;max-width:560px}
.a1-club{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.a1-feat{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--card);border-radius:3.2px;padding:18px 20px}
.a1-fan{position:relative;height:120px}
.a1-fan .cv{position:absolute;bottom:0;box-shadow:0 8px 16px rgb(0 0 0/.5)}
.a1-feat h3{font:400 1.9rem/.92 Anton;text-transform:uppercase}
.a1-feat .m,.a1-row .m{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--faint);font:700 .78rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase}
.a1-feat .m b,.a1-row .m b{color:var(--dim);font-weight:700}
.a1-feat p{color:var(--dim);font-size:.92rem;margin-top:6px;line-height:1.4}
.a1-num{font:400 4rem/.8 Anton;text-align:right}
.a1-num small{display:block;font:700 .74rem/1 "Barlow Condensed";letter-spacing:.08em;color:var(--faint);margin-top:6px}
.a1-row{display:grid;grid-template-columns:262px minmax(0,1fr) 90px;gap:20px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.a1-strip{display:flex;gap:4px}
.a1-row h3{font:400 1.5rem/.95 Anton;text-transform:uppercase}
.a1-row .a1-num{font-size:2.6rem}
.a1-hit{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font:700 .8rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;color:var(--fg)}
.a1-hit em{font:400 1.1rem/1 Anton;font-style:normal;color:var(--hl)}
.pshell .a1-club{grid-template-columns:1fr}
.pshell .a1-feat{grid-template-columns:92px minmax(0,1fr);padding:14px}
.pshell .a1-feat .a1-num{display:none}
.pshell .a1-fan{height:86px;transform:scale(.6);transform-origin:left bottom}
.pshell .a1-feat h3{font-size:1.4rem}
.pshell .a1-row{grid-template-columns:minmax(0,1fr) 54px;gap:10px}
.pshell .a1-row .a1-strip{grid-column:1/-1;order:3}
.pshell .a1-row h3{font-size:1.25rem}
.pshell .a1-row .a1-num{font-size:2rem}

/* ================= 1B bookcase ================= */
.b1-case{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start;margin-top:22px}
.b1-shelf{background:var(--card);border-radius:3.2px;padding:20px 22px 0;margin-bottom:22px}
.b1-shelf h3{font:400 1.5rem/.9 Anton;text-transform:uppercase;display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.b1-shelf h3 small{font:700 .78rem/1 "Barlow Condensed";letter-spacing:.08em;color:var(--faint)}
.b1-row{display:flex;align-items:flex-end;gap:6px;min-height:300px}
.b1-board{height:14px;background:var(--bs);margin:0 -22px;box-shadow:0 8px 16px rgb(0 0 0/.5)}
.sp{position:relative;width:var(--w,70px);height:var(--h,260px);border-radius:2.4px 2.4px 0 0;padding:12px 0 10px;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--bgc,var(--muted));color:var(--tc,var(--fg));box-shadow:inset 0 0 0 1px rgb(244 244 240/.12),inset -6px 0 10px -6px rgb(0 0 0/.5);flex:none;transition:transform .2s}
.sp .ti{writing-mode:vertical-rl;transform:rotate(180deg);font:400 1.3rem/1 Anton;text-transform:uppercase;flex:1;overflow:hidden;max-height:200px;text-align:right}
.sp hr{width:70%;border:0;border-top:1px solid currentColor;opacity:.6;margin:0}
.sp .c{font:400 1.25rem/1 Anton}
.sp .o{font:800 .72rem/1 "Barlow Condensed";letter-spacing:.05em;opacity:.8}
.sp.paper{--bgc:var(--fg);--tc:var(--bg)}
.sp.ink{--bgc:var(--muted);--tc:var(--fg)}
.sp.dim2{--bgc:#2a2a31;--tc:var(--fg)}
.sp.pick{transform:translateY(-18px);box-shadow:inset 0 0 0 2px var(--hl),0 14px 28px rgb(0 0 0/.55)}
.sp.out{opacity:.28}
.sp .yours{position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-4deg);background:var(--hl);color:var(--bg);font:800 .68rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;padding:4px 6px 3px;border-radius:2px;white-space:nowrap}
.sp .hit{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);font:400 .95rem/1 Anton;padding:4px 6px 3px;border-radius:2px;white-space:nowrap}
.sp .pv{position:absolute;bottom:58px;width:100%;text-align:center}
.b1-out{background:var(--card);border-radius:3.2px;padding:20px 22px;box-shadow:0 12px 30px rgb(0 0 0/.5);position:relative;overflow:hidden}
.b1-out::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--fg)}
.b1-out h3{font:400 2.2rem/.92 Anton;text-transform:uppercase;margin-top:6px}
.b1-out .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.b1-out .grid .cv{width:100%!important}
.pshell .b1-case{grid-template-columns:1fr;gap:16px}
.pshell .b1-shelf{padding:16px 14px 0;overflow:hidden}
.pshell .b1-row{min-height:230px;gap:5px;overflow:hidden}
.pshell .b1-board{margin:0 -14px}
.pshell .sp{--h:200px!important;width:52px!important}
.pshell .sp .ti{font-size:1rem;max-height:140px}

/* ================= 1C cover wall ================= */
.c1-wall{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:26px 20px}
.c1-tile .mos{display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:3.2px;overflow:hidden;position:relative}
.c1-tile .mos .cv{width:100%!important;border-radius:0}
.c1-tile .mos .cnt{position:absolute;right:6px;bottom:6px;background:rgb(11 11 13/.86);padding:6px 8px 5px;font:400 1.6rem/.85 Anton;border-radius:2px}
.c1-tile h3{font:400 1.25rem/.95 Anton;text-transform:uppercase;margin-top:10px}
.c1-tile .m{display:flex;align-items:center;gap:7px;margin-top:6px;color:var(--faint);font:700 .76rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase}
.c1-club{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.c1-band{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;border-radius:3.2px;overflow:hidden;position:relative}
.c1-band .cv{width:100%!important;border-radius:0}
.c1-bw .in{margin-top:10px}
.c1-bw h3{font:400 2rem/.9 Anton;text-transform:uppercase}
.c1-bw .m{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--dim);font:700 .78rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase}
.c1-tile .mos .cv.ring{box-shadow:inset 0 0 0 3px var(--hl)}
.c1-tile .mos .rk1{position:absolute;left:6px;top:6px;background:var(--hl);color:var(--bg);font:400 1.1rem/1 Anton;padding:4px 6px 3px;border-radius:2px;z-index:2}
.pshell .c1-wall{grid-template-columns:1fr 1fr;gap:20px 12px}
.pshell .c1-club{grid-template-columns:1fr}
.pshell .c1-bw h3{font-size:1.5rem}
.pshell .c1-tile h3{font-size:1.05rem}

/* ================= 2A chart ================= */
.a2-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:18px;padding:12px 14px;background:var(--card)}
.a2-bar .g{display:flex;align-items:center;gap:8px}
.a2-bar .g>span:first-child{font:700 .76rem/1 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.a2-bar .r{margin-left:auto;display:flex;gap:8px}
.a2-list{margin-top:10px}
.a2-row{display:grid;grid-template-columns:22px 70px 64px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--border)}
.a2-row .rk{font:400 3.4rem/.8 Anton;width:auto;text-align:right}
.a2-row.top .rk{color:var(--fg)}
.a2-row h3{font:400 1.55rem/.95 Anton;text-transform:uppercase}
.a2-row h3 small{font:700 .78rem/1 "Barlow Condensed";letter-spacing:.07em;color:var(--faint);margin-left:8px}
.a2-row .nt{color:var(--dim);font-style:italic;margin-top:5px;font-size:.95rem;max-width:62ch}
.a2-row .nt.add{font-style:normal;color:var(--faint);text-decoration:underline;text-underline-offset:3px;font:700 .78rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase}
.a2-row.drag{background:var(--muted);box-shadow:0 12px 30px rgb(0 0 0/.5),inset 0 0 0 2px var(--hl);transform:rotate(-.6deg);position:relative;z-index:2}
.a2-row.ghost{opacity:.35}
.a2-edit{grid-column:4/6}
.a2-edit .fld{width:100%}
.a2-edit .ft{display:flex;align-items:center;gap:8px;margin-top:8px}
.a2-edit .ft .ctr{margin-right:auto}
.a2-row.ro{grid-template-columns:70px 64px minmax(0,1fr) auto}
.a2-row .when{font:700 .8rem/1.1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;color:var(--faint);text-align:right}
.a2-row .when b{display:block;font:400 1.6rem/.9 Anton;color:var(--fg)}
.pshell .a2-bar{padding:10px;gap:10px}
.pshell .a2-bar .r{margin-left:0}
.pshell .a2-row{grid-template-columns:14px 30px 48px minmax(0,1fr);gap:8px;padding:10px 0}
.pshell .a2-row.editing{padding:10px 6px!important}
.pshell .a2-row .rk{font-size:2rem}
.pshell .a2-row .cv{width:48px!important}
.pshell .a2-row h3{font-size:1.15rem}
.pshell .a2-row .nt{font-size:.85rem}
.pshell .a2-row .rtools{grid-column:1/-1;justify-content:flex-end;margin-top:-4px}
.pshell .a2-edit{grid-column:1/-1}
.pshell .a2-row.ro{grid-template-columns:48px minmax(0,1fr) auto}

/* ================= 2B shelf ================= */
.b2-wrap{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:26px;align-items:start;margin-top:20px}
.b2-shelf{background:var(--card);border-radius:3.2px;padding:34px 18px 0;overflow:hidden}
.b2-row .sp .ti{font-size:1.05rem}
.b2-row{display:flex;align-items:flex-end;gap:6px;min-height:330px}
.b2-pod{display:flex;align-items:flex-end;gap:6px;padding:0 10px 0 0;margin-right:8px;border-right:1px dashed var(--bs)}
.b2-pod .sp .rkb{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font:400 1.6rem/1 Anton}
.sp .rkt{font:400 1.25rem/1 Anton}
.b2-hint{font:700 .74rem/1.2 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 0 14px}
.b2-out{background:var(--card);border-radius:3.2px;padding:20px;box-shadow:0 12px 30px rgb(0 0 0/.5);position:relative}
.b2-out .top{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:end}
.b2-out .top .rk{font:400 4rem/.8 Anton;width:auto;text-align:left}
.b2-out h3{font:400 1.9rem/.92 Anton;text-transform:uppercase;margin-top:6px}
.b2-out .mv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.b2-strip{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:20px;padding:14px 16px;border-radius:3.2px;background:var(--card)}
.b2-strip .g{display:flex;align-items:center;gap:8px}
.b2-strip .g>span:first-child{font:700 .76rem/1 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.b2-strip .r{margin-left:auto;display:flex;gap:8px}
.pshell .b2-wrap{grid-template-columns:1fr;gap:16px}
.pshell .b2-shelf{padding:26px 14px 0;overflow:hidden}
.pshell .b2-row{min-height:230px;gap:4px;overflow:hidden}
.pshell .b2-row .sp{width:42px!important;--h:190px!important}
.pshell .b2-row .sp .ti{font-size:.95rem;max-height:120px}
.pshell .b2-strip .r{margin-left:0}

/* ================= 2C ledger ================= */
.c2-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:26px;align-items:start;margin-top:20px}
.c2-t{width:100%;border-collapse:collapse}
.c2-t th{font:700 .74rem/1 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:left;padding:0 8px 8px;border-bottom:1px solid var(--bs)}
.c2-t td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.c2-t .n{font:400 1.5rem/1 Anton;text-align:right;width:40px}
.c2-t .g b{display:block;font:600 1rem/1.2 Barlow}
.c2-t .g small{color:var(--faint);font-size:.82rem}
.c2-t .nt{color:var(--dim);font-size:.9rem;line-height:1.35}
.c2-t .ad{font:700 .78rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.c2-t tr.on td{background:var(--muted)}
.c2-t tr.on td:first-child{box-shadow:inset 2px 0 0 var(--hl)}
.c2-rail{background:var(--card);border-radius:3.2px;padding:18px}
.c2-rail h3{font:400 1.45rem/.9 Anton;text-transform:uppercase;padding-bottom:8px;border-bottom:2px solid var(--fg);margin-bottom:12px}
.c2-rail .k{margin-top:14px}
.c2-radio{display:flex;flex-direction:column;gap:4px}
.c2-radio span{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:2.4px;font:700 .9rem/1 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.c2-radio span i.d{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--faint);flex:none}
.c2-radio span.on{background:var(--muted);color:var(--fg);box-shadow:inset 0 0 0 1px var(--hl)}
.c2-radio span.on i.d{box-shadow:inset 0 0 0 4px var(--hl)}
.c2-radio span small{margin-left:auto;font-size:.72rem;color:var(--faint)}
.c2-rail .sep{border-top:1px solid var(--border);margin:16px 0}
.c2-arm{border:1.5px dashed var(--dest);border-radius:3px;padding:14px;margin-top:12px;position:relative}
.c2-arm>b{position:absolute;top:-9px;left:10px;background:var(--card);padding:0 6px;font:800 .72rem/1.2 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--dest)}
.c2-arm p{color:var(--dim);font-size:.9rem;line-height:1.45}
.c2-arm p strong{color:var(--fg)}
.pshell .c2-wrap{grid-template-columns:1fr}
.pshell .c2-rail{order:-1}
.c2-prow{display:grid;grid-template-columns:20px 30px 44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.c2-prow .n{font:400 1.4rem/1 Anton;text-align:right}
.c2-prow b{font:600 .95rem/1.2 Barlow;display:block}
.c2-prow small{color:var(--faint);font-size:.8rem;display:block;line-height:1.3}
.c2-disc{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--card);border-radius:3.2px;margin-top:14px;font:700 .9rem/1 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase}
.c2-disc span{color:var(--faint);font-size:.78rem}

/* ================= 2D cover wall ================= */
.d2-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:18px}
.d2-tools .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.d2-wall{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:26px 20px;margin-top:22px}
.d2-t{position:relative}
.d2-t .cv{width:100%!important}
.d2-t .nb{position:absolute;left:-6px;top:-8px;z-index:2;background:var(--fg);color:var(--bg);font:400 2rem/.85 Anton;padding:6px 8px 4px;border-radius:2px;box-shadow:0 6px 14px rgb(0 0 0/.45);transform:rotate(-3deg)}
.d2-t h3{font:400 1.15rem/.95 Anton;text-transform:uppercase;margin-top:10px}
.d2-t p{color:var(--dim);font-size:.86rem;line-height:1.38;margin-top:5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.d2-ctl{display:flex;align-items:center;justify-content:space-between;background:var(--muted);height:34px;padding:0 4px;margin-top:6px;border-radius:2.4px}
.d2-ctl .btn{box-shadow:none;color:var(--dim)}
.d2-t.drag .cv{box-shadow:0 0 0 3px var(--hl),0 18px 36px rgb(0 0 0/.6);transform:rotate(2deg) translateY(-8px)}
.d2-t.slot .cv{opacity:0}
.d2-t.slot::before{content:"";position:absolute;left:0;right:0;top:0;aspect-ratio:3/4;border:2px dashed var(--hl);border-radius:3px}
.d2-t.slot .lbl{position:absolute;top:40%;left:0;right:0;text-align:center;font:800 .8rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;color:var(--hl)}
.d2-pop{position:absolute;left:-10px;right:-60px;top:calc(100% - 120px);z-index:4;background:var(--card);border-radius:3.2px;box-shadow:0 18px 40px rgb(0 0 0/.6),inset 0 0 0 1px var(--hl);padding:12px}
.d2-pop .fld{width:100%}
.d2-pop .ft{display:flex;align-items:center;gap:6px;margin-top:8px}
.d2-pop .ft .ctr{margin-right:auto}
.d2-add{aspect-ratio:3/4;border:1.5px dashed var(--bs);border-radius:3px;display:grid;place-items:center;text-align:center;color:var(--dim);font:800 .9rem/1.2 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase}
.d2-date{position:absolute;left:6px;top:6px;z-index:2;background:rgb(11 11 13/.86);padding:5px 7px 4px;font:700 .78rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;border-radius:2px}
.d2-sw{display:inline-flex;align-items:center;gap:10px;font:700 .86rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.d2-ba{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.d2-ba>div{background:var(--bg);border-radius:3px;padding:12px}
.d2-ba h4{font:700 .76rem/1 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.d2-ba li{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--dim);padding:3px 0}
.d2-ba li b{color:var(--fg);font-weight:600}
.pshell .d2-pop{left:auto;right:0;width:250px}
.pshell .d2-wall{grid-template-columns:1fr 1fr;gap:24px 14px}
.pshell .d2-tools .r{margin-left:0}
.pshell .d2-ba{grid-template-columns:1fr}

/* ================= 3A sentence ================= */
.a3-pop{background:var(--card);border-radius:3.2px;margin:10px 0 0 120px;width:420px;padding:10px;box-shadow:0 12px 30px rgb(0 0 0/.5)}
.a3-pop .o{display:flex;align-items:baseline;gap:10px;padding:9px 10px;border-radius:2.4px}
.a3-pop .o b{font:700 .95rem/1 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;min-width:100px}
.a3-pop .o span{color:var(--faint);font-size:.88rem}
.a3-pop .o.on{background:var(--muted);box-shadow:inset 0 0 0 1px var(--hl)}
.a3-games{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:12px}
.a3-games .add{width:84px;aspect-ratio:3/4;border:1.5px dashed var(--bs);border-radius:3px;display:grid;place-items:center;color:var(--dim)}
.a3-g{position:relative}
.a3-g .x{position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:2px;background:rgb(11 11 13/.8);display:grid;place-items:center;z-index:2}
.a3-g .x svg.lucide{width:12px;height:12px}
.a3-g .n{position:absolute;left:4px;top:4px;z-index:2;background:var(--fg);color:var(--bg);font:400 1rem/1 Anton;padding:3px 5px 2px;border-radius:2px}
.pshell .a3-pop{margin:10px 0 0;width:100%}

/* ================= 3B form + proof ================= */
.b3-wrap{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:32px;align-items:start;margin-top:22px}
.b3-f{display:flex;flex-direction:column;gap:20px}
.b3-f .rowh{display:flex;justify-content:space-between;align-items:baseline}
.b3-proof{background:var(--card);border-radius:3.2px;padding:18px}
.b3-proof h4{font:700 .76rem/1 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.b3-proof .pv{background:var(--bg);border-radius:3px;padding:16px}
.b3-proof .pv h3{font:400 2.4rem/.9 Anton;text-transform:uppercase;padding-bottom:8px;border-bottom:2px solid var(--fg)}
.b3-proof .who{margin-top:14px;font-size:.9rem;color:var(--dim);display:flex;gap:8px;align-items:flex-start}
.b3-proof .who svg.lucide{width:16px;height:16px;color:var(--faint);margin-top:3px}
.pshell .b3-wrap{grid-template-columns:1fr}

/* ================= 3C games first ================= */
.c3-q{display:flex;gap:10px;margin-top:20px}
.c3-q .fld{flex:1;height:48px;font-size:1.1rem}
.c3-res{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:16px 14px;margin-top:18px}
.c3-r{position:relative}
.c3-r .cv{width:100%!important}
.c3-r p{font:600 .84rem/1.25 Barlow;margin-top:6px}
.c3-r small{color:var(--faint);font-size:.76rem}
.c3-r .pk{position:absolute;right:5px;top:5px;z-index:2;width:26px;height:26px;border-radius:2px;display:grid;place-items:center;background:rgb(11 11 13/.8);color:var(--fg)}
.c3-r.on .pk{background:var(--hl);color:var(--bg)}
.c3-r.on .cv{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--hl)}
.c3-r .pk svg.lucide{width:15px;height:15px}
.c3-tray{margin-top:26px;background:var(--card);border-radius:3.2px;box-shadow:inset 0 2px 0 var(--hl);padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
.c3-tray .n{font:400 3.6rem/.8 Anton;color:var(--hl)}
.c3-tray .n small{display:block;font:700 .72rem/1 "Barlow Condensed";letter-spacing:.08em;color:var(--dim);margin-top:6px}
.c3-tray .st{display:flex;gap:5px;margin-top:10px}
.c3-tray .f{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:end}
.pshell .c3-res{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}
.pshell .c3-tray{grid-template-columns:1fr;gap:12px;padding:14px}
.pshell .c3-tray .f{grid-template-columns:1fr}
.pshell .c3-q .fld{height:42px;font-size:1rem}
</style>
</head><body>
<script>
/* ---------- page data helpers ---------- */
const SORT = { ranked: "Ranked", alphabetical: "A to Z", added: "Date added" };
const cnt = (l) => l.count ?? l.games.length;
const owner = (l, s = 20) => `${av(l.owner, s)}<span>${who(l.owner)}</span>`;
const covers = (l, n, w, o = {}) => l.games.slice(0, n).map(([k]) => cover(k, w, o)).join("");
const asUser = (html, k) => html.replace(av("mara", 32), av(k, 32)).replace("<b>Mara</b><small>@mara</small>", `<b>${M[k].n}</b><small>@${M[k].n.toLowerCase().replace(/ /g, "")}</small>`);
const withDlg = (html, dlg) => `<div style="position:relative">${html}<div class="ov"><div class="scrim"></div><div class="dlg">${dlg}</div></div></div>`;
const T10 = LISTS.top10, SL = LISTS.souls;
const slAdded = [...SL.games].reverse(); /* Date added, newest first */
const MEMBERS = [LISTS.top10, LISTS.souls, LISTS.jrpg, LISTS.gen7, LISTS.ffmain];
const CLUB = [LISTS.canon, LISTS.gotm25];
const pv = `<span class="chip hl">Preview</span>`;
const visChip = (l) => l.vis === "private" ? `<span class="chip ols">${ic("lock")}Private</span>` : `<span class="chip ols">${ic("users")}Members</span>`;
const linked = `<span class="linked">${ic("flag")}Feeds <u>Soulslike Summer</u></span>`;
const NOTE_EDIT = "The opera house, Kefka, the world of ruin. Everything after copies a piece of it, and the second half still has the bravest structure in the series";
const takeoverText = (mode) => mode === "private"
  ? `<p><b>Soulslike, but make it history</b> feeds the Challenge <b>Soulslike Summer</b>. If you make it Private, the club keeps a Members-visible copy for that Challenge, and your Private list stops feeding it.</p>`
  : `<p><b>Soulslike, but make it history</b> feeds the Challenge <b>Soulslike Summer</b>. If you delete it, the list isn't gone: the club takes it over so the Challenge's history survives. It stops being yours, and you can't get it back.</p>`;

/* ================= Surface 1 ================= */
/* 1A: the contents page */
const a1Feat = (l) => `<div class="a1-feat"><div class="a1-fan">${l.games.slice(0, 3).map(([k], i) => `<span style="position:absolute;left:${i * 32}px;bottom:${i === 1 ? 6 : 0}px;transform:rotate(${[-4, 1, 5][i]}deg)">${cover(k, 76)}</span>`).join("")}</div>
  <div><h3>${l.name}</h3><p>${l.desc}</p><div class="m">${owner(l)}<span>·</span><b>${SORT[l.sort]}</b></div></div>
  <div class="a1-num">${cnt(l)}<small>games</small></div></div>`;
const a1Row = (l, hit) => `<div class="a1-row"><div class="a1-strip">${covers(l, 5, 48)}</div>
  <div><h3>${l.name}</h3><div class="m">${owner(l)}<span>·</span><b>${SORT[l.sort]}</b><span>·</span><span>Updated ${l.updated}</span></div>
  ${hit ? `<div class="a1-hit">${ic("search")}Final Fantasy VI is <em>${hit}</em></div>` : ""}</div>
  <div class="a1-num">${cnt(l)}<small>games</small></div></div>`;
const a1Head = (ph) => `<div class="hd"><h1>Lists</h1>${pv}<span class="n lb">${CLUB.length + MEMBERS.length} Game Lists</span><div class="act"><span class="btn hl">${ic("plus")}New list</span></div></div>`;
const a1Search = (q) => `<div class="a1-search"><div class="fld ${q ? "focus" : "ph"}">${ic("search")}${q ? `<span class="tok">${cover("ff6", 18)}Final Fantasy VI${ic("x")}</span>` : "Search lists by name or by a game in them"}</div></div>`;
const a1 = (ph) => `${a1Head(ph)}${a1Search()}
  <div class="sec"><h2>The club's lists</h2><span class="n lb">Kept by the Moderators</span></div><div class="a1-club">${CLUB.map(a1Feat).join("")}</div>
  <div class="sec"><h2>Members' lists</h2><span class="n lb">Last updated first</span></div>${(ph ? MEMBERS.slice(0, 3) : MEMBERS).map((l) => a1Row(l)).join("")}`;
const a1q = () => `${a1Head()}${a1Search(true)}
  <div class="sec"><h2>Lists with Final Fantasy VI</h2><span class="n lb">3 Game Lists</span></div>
  ${a1Row(LISTS.canon, "No. 2 of 20")}${a1Row(LISTS.top10, "No. 2 of 10")}${a1Row({ ...LISTS.ffmain, games: [["ff6"], ["ff9"], ["ff10"], ["ff7"], ["ff4"]] }, "No. 1 of 16")}`;

/* 1B: the bookcase */
const spine = (l, i, o = {}) => {
  const bind = l.owner ? ["ink", "dim2", "ink", "dim2", "ink"][i % 5] : "paper";
  return `<div class="sp ${bind} ${o.cls || ""}" style="--w:${Math.min(96, 58 + cnt(l) * 1.4)}px;--h:${232 + ((l.id * 37) % 46)}px">${o.yours ? `<span class="yours">Yours</span>` : ""}${o.hit ? `<span class="hit">${o.hit}</span>` : ""}
  <span class="ti">${l.name}</span><hr><span class="c">${cnt(l)}</span><span class="o">${l.owner ? M[l.owner].n.split(" ").map((w) => w[0]).join("") : "Club"}</span></div>`;
};
const b1Out = (l, ph) => `<div class="b1-out"><div class="byl" style="margin-top:4px">${owner(l, 22)}<span class="dot"></span><span>${SORT[l.sort]}</span><span class="dot"></span><span>${cnt(l)} games</span></div>
  <h3>${l.name}</h3><p class="desc">${l.desc}</p><div class="grid">${covers(l, ph ? 4 : 8, 70)}</div>
  <div style="display:flex;gap:8px;margin-top:16px"><span class="btn">${ic("arrow-right")}Open the list</span></div></div>`;
const b1 = (ph, q) => `${a1Head(ph)}${a1Search(q)}
  <div class="b1-case"><div>
    <div class="b1-shelf"><h3>The club's shelf<small>${CLUB.length} lists</small></h3><div class="b1-row">${CLUB.map((l, i) => spine(l, i, q ? { hit: i === 0 ? "No. 2" : "", cls: i === 0 ? "" : "out" } : {})).join("")}</div><div class="b1-board"></div></div>
    <div class="b1-shelf"><h3>Members' shelf<small>${MEMBERS.length} lists, last updated on the left</small></h3><div class="b1-row">${MEMBERS.map((l, i) => spine(l, i, q ? { hit: { 12: "No. 2", 41: "No. 1" }[l.id], cls: [12, 41].includes(l.id) ? (l.id === 12 ? "pick" : "") : "out", yours: l.owner === "mara" } : { cls: i === 0 ? "pick" : "", yours: l.owner === "mara" })).join("")}</div><div class="b1-board"></div></div>
  </div>${b1Out(LISTS.top10, ph)}</div>`;

/* 1C: the cover wall */
const c1Tile = (l, o = {}) => {
  const g = o.lead ? [[o.lead], ...l.games.filter(([k]) => k !== o.lead)] : l.games;
  return `<div class="c1-tile" style="${o.out ? "opacity:.3" : ""}"><div class="mos">${g.slice(0, 4).map(([k], i) => cover(k, 100, { cls: o.lead && i === 0 ? "ring" : "" })).join("")}${o.rank ? `<span class="rk1">${o.rank}</span>` : ""}<span class="cnt">${cnt(l)}</span></div>
  <h3>${l.name}</h3><div class="m">${owner(l, 18)}<span>·</span><span>${SORT[l.sort]}</span></div></div>`;
};
const c1Band = (l) => `<div class="c1-bw"><div class="c1-band">${covers(l, 6, 100)}</div><div class="in"><h3>${l.name}</h3><div class="m">${owner(l, 20)}<span>·</span><span>${cnt(l)} games</span><span>·</span><span>${SORT[l.sort]}</span></div></div></div>`;
const c1 = (ph, q) => `${a1Head(ph)}${a1Search(q)}
  ${q ? `<div class="sec"><h2>Lists with Final Fantasy VI</h2><span class="n lb">3 of ${CLUB.length + MEMBERS.length}</span></div>
    <div class="c1-wall">${[[LISTS.canon, "No. 2"], [LISTS.top10, "No. 2"], [{ ...LISTS.ffmain, games: [["ff6"], ["ff9"], ["ff10"], ["ff7"]] }, "No. 1"]].map(([l, r]) => c1Tile(l, { lead: "ff6", rank: r })).join("")}${ph ? "" : [LISTS.souls, LISTS.gen7].map((l) => c1Tile(l, { out: 1 })).join("")}</div>`
    : `<div class="sec"><h2>The club's lists</h2></div><div class="c1-club">${CLUB.map(c1Band).join("")}</div>
    <div class="sec"><h2>Members' lists</h2><span class="n lb">Last updated first</span></div><div class="c1-wall">${(ph ? MEMBERS.slice(0, 4) : MEMBERS).map((l) => c1Tile(l)).join("")}</div>`}`;

/* ================= Surface 2 ================= */
const back = (ph, to = "Lists") => (ph ? `<span class="pback" aria-label="Back to ${to}">${ic("arrow-left")}</span><br>` : `<span class="back">${ic("arrow-left")}${to}</span>`);
const head2 = (l, ph, acts) => `${back(ph)}<div class="hd"><h1>${l.name}</h1><span class="n lb">${cnt(l)} games</span><div class="act">${acts}</div></div>`;
const ownActs = (ph) => `<span class="btn">${ic("flag")}${ph ? "Start a Challenge" : "Start a Challenge from this list"}</span><span class="btn hl">${ic("plus")}Add a game</span>`;
const byline = (l, extra = "") => `<div class="byl">${owner(l, 22)}<span class="dot"></span>${visChip(l)}<span class="dot"></span><span>Updated ${l.updated}</span>${extra}</div><p class="desc">${l.desc}</p>`;

/* 2A: the chart */
const a2Row = ([k, note], i, o = {}) => {
  const g = G[k];
  if (o.edit) return `<div class="a2-row editing" style="padding:12px 10px"><span class="grip">${ic("grip-vertical")}</span><span class="rk">${i + 1}</span>${cover(k, 64)}
    <div><h3>${g.t}<small>${g.y}</small></h3></div><div></div>
    <div class="a2-edit"><div class="fld area focus">${NOTE_EDIT}<span class="caret"></span></div><div class="ft"><span class="ctr"><b>${NOTE_EDIT.length}</b> / 280</span><span class="btn sm gh">Cancel</span><span class="btn sm hl">Save note</span></div></div></div>`;
  return `<div class="a2-row ${i < 3 ? "top" : ""} ${o.cls || ""}"><span class="grip">${ic("grip-vertical")}</span><span class="rk">${i + 1}</span>${cover(k, 64)}
  <div><h3>${g.t}<small>${g.y}</small></h3>${note ? `<p class="nt">${note}</p>` : `<span class="nt add">Add a note</span>`}</div>
  <div class="rtools"><span class="btn sm ic" title="Move up">${ic("arrow-up")}</span><span class="btn sm ic" title="Move down">${ic("arrow-down")}</span><span class="btn sm ic" title="Edit note">${ic("pencil")}</span><span class="btn sm ic x" title="Remove from list">${ic("x")}</span></div></div>`;
};
const a2Bar = (ph) => `<div class="a2-bar editing"><div class="g"><span>Order</span><span class="seg sm"><span class="on">${ic("list-ordered")}Ranked</span><span>A to Z</span><span>Date added</span></span></div>
  <div class="g"><span>Seen by</span><span class="seg sm"><span class="on">${ic("users")}Members</span><span>${ic("lock")}Private</span></span></div>
  <div class="r"><span class="btn sm gh">${ic("pencil")}Rename</span><span class="btn sm ds">${ic("trash-2")}Delete list</span></div></div>`;
const a2 = (ph) => `${head2(T10, ph, ownActs(ph))}${byline(T10)}${a2Bar(ph)}
  <div class="a2-list">${T10.games.slice(0, ph ? 4 : 6).map((e, i) => i === 1 ? a2Row(e, i, { edit: 1 }) : i === 3 && !ph ? a2Row(e, i, { cls: "drag" }) + `<div class="drop"><span>Drop here · 6th</span></div>` : i === 5 ? a2Row(e, i, { cls: "ghost" }) : a2Row(e, i)).join("")}</div>`;
const a2ro = (ph) => `${head2(SL, ph, `<span class="btn">${ic("plus")}Propose to the Challenge</span>`.replace(/.*/, ""))}${byline(SL, `<span class="dot"></span>${linked}`)}
  <div class="a2-bar"><div class="g"><span>Order</span><span class="seg sm"><span>Ranked</span><span>A to Z</span><span class="on">${ic("calendar-plus")}Date added</span></span></div></div>
  <div class="a2-list">${slAdded.map(([k, note, d], i) => `<div class="a2-row ro">${`<span class="when"><b>${d === "today" ? "Today" : d.split(" ")[0]}</b>${d === "today" ? "24 Nov" : d.split(" ")[1]}</span>`}${cover(k, 64)}<div><h3>${G[k].t}<small>${G[k].y}</small></h3><p class="nt">${note}</p></div><div></div></div>`).join("")}</div>`;
const a2tk = (ph) => withDlg(asUser(desk(`${head2(SL, 0, ownActs(0))}${byline(SL, `<span class="dot"></span>${linked}`)}${a2Bar().replace('<span class="btn sm ds">', '<span class="btn sm ds" style="box-shadow:inset 0 0 0 2px var(--dest)">')}<div class="a2-list">${slAdded.slice(0, 3).map(([k, n], i) => a2Row([k, n], i)).join("")}</div>`, "lists"), "grind"),
  `<h3>Delete this list?</h3>${takeoverText()}<ul class="notes" style="margin-top:12px"><li><b>Soulslike Summer</b> keeps all its games and Runs.</li><li>The list moves to the club's lists, marked "from Grindlord".</li></ul><div class="bt"><span class="btn gh">Keep my list</span><span class="btn dss">${ic("trash-2")}Delete, the club keeps a copy</span></div>`);

/* 2B: the shelf */
const tspine = ([k], i, o = {}) => `<div class="sp ${["ink", "dim2"][i % 2]} ${o.cls || ""}" style="--w:${o.w || 64}px;--h:${o.h || 250 + ((i * 53) % 40)}px">${o.rkb ? `<span class="rkb">${i + 1}</span>` : ""}<span class="ti">${G[k].t}</span><hr>${o.date ? `<span class="o">${o.date}</span>` : `<span class="rkt">${i + 1}</span>`}</div>`;
const b2Shelf = (games, o = {}) => `<div class="b2-shelf"><div class="b2-row">${o.pod !== false ? `<div class="b2-pod">${[1, 0, 2].map((i) => tspine(games[i], i, { rkb: 1, h: [300, 330, 280][i === 0 ? 1 : i === 1 ? 0 : 2], w: 56 })).join("")}</div>` : ""}
  ${games.slice(o.pod !== false ? 3 : 0).map((e, j) => { const i = j + (o.pod !== false ? 3 : 0); return tspine(e, i, { w: 48, cls: i === o.pick ? "pick" : "", date: o.dates ? (e[2] === "today" ? "24 Nov" : e[2]) : null, h: o.dates ? 240 + ((i * 41) % 50) : null }); }).join("")}</div>
  <div class="b1-board" style="margin:0 -22px"></div><p class="b2-hint">${o.hint}</p></div>`;
const b2Out = (k, i, note, ph) => `<div class="b2-out editing"><div class="top">${cover(k, 96)}<div><span class="rk">${i + 1}</span><h3>${G[k].t}</h3></div></div>
  <span class="flab" style="margin-top:16px">Your note</span><div class="fld area focus">${note}<span class="caret"></span></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span class="ctr"><b>${note.length}</b> / 280</span><span class="btn sm hl">Save note</span></div>
  <div class="mv"><span class="btn sm">${ic("arrow-left")}Move up</span><span class="btn sm">Move down${ic("arrow-right")}</span></div>
  <div style="display:flex;justify-content:space-between;margin-top:12px"><span class="btn sm gh">${ic("external-link")}Game page</span><span class="btn sm ds">${ic("x")}Remove</span></div></div>`;
const b2Strip = () => `<div class="b2-strip editing"><div class="g"><span>Shelve by</span><span class="seg sm"><span class="on">Ranked</span><span>A to Z</span><span>Date added</span></span></div>
  <div class="g"><span>Seen by</span><span class="seg sm"><span class="on">Members</span><span>${ic("lock")}Private</span></span></div><div class="r"><span class="btn sm ds">${ic("trash-2")}Delete list</span><span class="btn sm hl">${ic("check")}Done editing</span></div></div>`;
const b2 = (ph) => `${head2(T10, ph, ownActs(ph))}${byline(T10)}${b2Strip()}
  <div class="b2-wrap">${b2Shelf(T10.games, { pick: 3, hint: ph ? "Tap a spine to pick it. Hold and drag to move it." : "Drag a spine along the shelf, or pick it and use Move up and Move down. 1 to 3 stand on the podium." })}${b2Out("disco", 3, "A detective story where the best fights are with yourself. Play it before you read anything about it", ph)}</div>`;
const b2ro = () => `${head2(SL, 0, "")}${byline(SL, `<span class="dot"></span>${linked}`)}<div class="b2-wrap" style="grid-template-columns:minmax(0,1fr) 340px">${b2Shelf(slAdded, { pod: false, dates: 1, pick: 0, hint: "Shelved by date added, newest on the left." })}
  <div class="b2-out"><div class="top">${cover("wuchang", 96)}<div><span class="lb faint">Added today</span><h3>Wuchang: Fallen Feathers</h3></div></div><p class="nt" style="margin-top:14px;color:var(--dim);font-style:italic">Added for the Challenge. Ming dynasty, plague, feathers.</p><div style="margin-top:14px"><span class="btn sm">${ic("external-link")}Game page</span></div></div></div>`;
const b2tk = () => withDlg(asUser(desk(`${head2(SL, 0, ownActs(0))}${byline(SL, `<span class="dot"></span>${linked}`)}${b2Strip()}<div class="b2-wrap">${b2Shelf(slAdded, { pod: false, dates: 1, hint: "" })}<div></div></div>`, "lists"), "grind"),
  `<h3>Make it Private?</h3>${takeoverText("private")}
  <div style="display:flex;gap:18px;align-items:flex-end;margin-top:16px;padding:14px;background:var(--bg);border-radius:3px">
    <div style="text-align:center">${spine({ ...SL, owner: "grind" }, 0)}<span class="lb faint" style="display:block;margin-top:6px">Yours, Private</span></div>
    <div style="text-align:center">${spine({ ...SL, owner: null, id: 2 }, 0)}<span class="lb faint" style="display:block;margin-top:6px">Club copy</span></div>
    <p style="font-size:.9rem;flex:1">The copy goes on the club's shelf and keeps feeding <b>Soulslike Summer</b>. Games you add to your Private list stay yours.</p></div>
  <div class="bt"><span class="btn gh">Keep it Members-visible</span><span class="btn dss">${ic("lock")}Make Private, club keeps a copy</span></div>`);

/* 2C: the ledger */
const c2Rows = (games, o = {}) => games.map(([k, note, d], i) => `<tr class="${i === o.on ? "on" : ""}">${o.ro ? "" : `<td style="width:26px"><span class="grip">${ic("grip-vertical")}</span></td>`}<td class="n">${o.ro ? "" : i + 1}</td><td style="width:52px">${cover(k, 40)}</td>
  <td class="g"><b>${G[k].t}</b><small>${G[k].y}</small></td>
  <td class="nt">${i === o.on ? `<div class="fld area focus" style="min-height:64px">${NOTE_EDIT}<span class="caret"></span></div><div style="display:flex;align-items:center;gap:6px;margin-top:6px"><span class="ctr" style="margin-right:auto"><b>${NOTE_EDIT.length}</b> / 280</span><span class="btn xs gh">Cancel</span><span class="btn xs hl">Save</span></div>` : note || `<span class="tl">Add a note</span>`}</td>
  <td class="ad">${d ? (d === "today" ? "Today" : d) : ["1 Jan", "1 Jan", "1 Jan", "3 Jan", "3 Jan", "12 Mar", "2 May", "2 May", "30 Aug", "22 Nov"][i]}</td>
  ${o.ro ? "" : `<td><div class="rtools"><span class="btn xs ic">${ic("arrow-up")}</span><span class="btn xs ic">${ic("arrow-down")}</span><span class="btn xs ic x">${ic("x")}</span></div></td>`}</tr>`).join("");
const c2Rail = (arm, l = T10) => `<div class="c2-rail ${arm ? "" : "editing"}"><h3>List settings</h3>
  <span class="flab">Order</span><div class="c2-radio">${["Ranked", "A to Z", "Date added"].map((s) => `<span class="${SORT[l.sort] === s ? "on" : ""}"><i class="d"></i>${s}${s === "Ranked" ? "<small>Your order</small>" : ""}</span>`).join("")}</div>
  <span class="flab k">Seen by</span><div class="c2-radio"><span class="${arm === "private" ? "" : "on"}"><i class="d"></i>Members</span><span class="${arm === "private" ? "on" : ""}"><i class="d"></i>${ic("lock")}Only me<small>Private</small></span></div>
  <div class="sep"></div><span class="btn" style="width:100%">${ic("flag")}Start a Challenge from this list</span>
  <div class="sep"></div>${arm ? `<div class="c2-arm"><b>${arm === "private" ? "Making it Private" : "Deleting"}</b>${takeoverText(arm)}<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px"><span class="btn dss">${arm === "private" ? ic("lock") + "Make Private, club keeps a copy" : ic("trash-2") + "Delete, club keeps a copy"}</span><span class="btn gh">Cancel</span></div></div>` : `<span class="btn ds" style="width:100%">${ic("trash-2")}Delete list</span>`}</div>`;
const c2Table = (games, o) => `<table class="c2-t"><thead><tr>${o.ro ? "" : "<th></th>"}<th style="text-align:right">${o.ro ? "" : "#"}</th><th></th><th>Game</th><th>Note</th><th>Added</th>${o.ro ? "" : "<th></th>"}</tr></thead><tbody>${c2Rows(games, o)}</tbody></table>`;
const c2 = () => `${head2(T10, 0, `<span class="btn hl">${ic("plus")}Add a game</span>`)}${byline(T10)}
  <div class="c2-wrap"><div><div class="fld ph" style="margin-bottom:12px">${ic("search")}Add a game: search GameDB</div>${c2Table(T10.games, { on: 1 })}</div>${c2Rail()}</div>`;
const c2ph = () => `${head2(T10, 1, "")}${byline(T10)}<div class="c2-disc">${ic("settings-2")}List settings<span>Ranked · Members</span>${ic("chevron-down")}</div>
  <div style="display:flex;gap:8px;margin:12px 0"><span class="btn hl sm" style="flex:1">${ic("plus")}Add a game</span><span class="btn sm">${ic("flag")}Challenge</span></div>
  ${T10.games.slice(0, 6).map(([k, n], i) => `<div class="c2-prow"><span class="grip">${ic("grip-vertical")}</span><span class="n">${i + 1}</span>${cover(k, 44)}<div><b>${G[k].t}</b><small>${n ? n.slice(0, 60) + (n.length > 60 ? "..." : "") : "Add a note"}</small></div><span class="btn xs ic gh">${ic("ellipsis-vertical")}</span></div>`).join("")}`;
const c2ro = () => `${head2(SL, 0, "")}${byline(SL, `<span class="dot"></span>${linked}`)}<div style="margin-top:20px">${c2Table(slAdded, { ro: 1 })}</div>`;
const c2tk = () => asUser(desk(`${head2(SL, 0, "")}${byline(SL, `<span class="dot"></span>${linked}`)}<div class="c2-wrap"><div>${c2Table(slAdded.slice(0, 5), {})}</div>${c2Rail("delete", SL)}</div>`, "lists"), "grind");

/* 2D: the cover wall */
const d2Tile = ([k, note], i, o = {}) => `<div class="d2-t ${o.cls || ""}">${o.cls === "slot" ? `<span class="lbl">Drop here · ${i + 1}th</span>` : ""}${o.date ? `<span class="d2-date">${o.date}</span>` : `<span class="nb">${i + 1}</span>`}${cover(k, 200)}
  ${o.edit ? `<div class="d2-ctl"><span class="grip" style="padding:0 6px">${ic("grip-horizontal")}</span><span class="btn xs ic" title="Move up">${ic("arrow-left")}</span><span class="btn xs ic" title="Move down">${ic("arrow-right")}</span><span class="btn xs ic" title="Edit note">${ic("pencil")}</span><span class="btn xs ic" title="Remove">${ic("x")}</span></div>` : ""}
  <h3>${G[k].t}</h3>${note ? `<p>${note}</p>` : ""}${o.pop ? `<div class="d2-pop"><span class="flab">Note on ${G[k].t}</span><div class="fld area focus">${NOTE_EDIT}<span class="caret"></span></div><div class="ft"><span class="ctr"><b>${NOTE_EDIT.length}</b> / 280</span><span class="btn xs gh">Cancel</span><span class="btn xs hl">Save</span></div></div>` : ""}</div>`;
const d2Tools = (ph) => `<div class="d2-tools editing" style="padding:10px 12px"><span class="seg sm"><span class="on">Ranked</span><span>A to Z</span><span>Date added</span></span>
  <span class="d2-sw">Private<span class="sw off"><span class="t"></span></span></span><div class="r"><span class="btn sm ds">${ic("trash-2")}Delete list</span><span class="btn sm hl">${ic("check")}Done</span></div></div>`;
const d2 = (ph) => `${head2(T10, ph, ph ? `<span class="btn">${ic("flag")}Start a Challenge</span>` : `<span class="btn">${ic("flag")}Start a Challenge from this list</span><span class="btn sel">${ic("pencil")}Editing</span>`)}${byline(T10)}${d2Tools(ph)}
  <div class="d2-wall">${T10.games.slice(0, ph ? 4 : 9).map((e, i) => i === 1 ? d2Tile(e, i, { edit: 1, pop: 1 }) : i === 4 ? d2Tile(e, i, { edit: 1, cls: "drag" }) : i === 6 && !ph ? d2Tile(e, i, { cls: "slot" }) : d2Tile(e, i, { edit: 1 })).join("")}<div class="d2-add">${ic("plus")}<span>Add a game</span></div></div>`;
const d2ro = () => `${head2(SL, 0, "")}${byline(SL, `<span class="dot"></span>${linked}`)}<div class="d2-tools"><span class="seg sm"><span>Ranked</span><span>A to Z</span><span class="on">Date added</span></span></div>
  <div class="d2-wall" style="grid-template-columns:repeat(6,minmax(0,1fr))">${slAdded.map((e) => d2Tile(e, 0, { date: e[2] === "today" ? "Today" : e[2] })).join("")}</div>`;
const d2tk = () => withDlg(asUser(desk(`${head2(SL, 0, "")}${byline(SL, `<span class="dot"></span>${linked}`)}${d2Tools()}<div class="d2-wall" style="grid-template-columns:repeat(6,minmax(0,1fr))">${slAdded.map((e) => d2Tile(e, 0, { date: e[2] === "today" ? "Today" : e[2], edit: 1 })).join("")}</div>`, "lists"), "grind"),
  `<h3>Delete this list?</h3>${takeoverText()}<div class="d2-ba"><div><h4>Now</h4><ul><li>${av("grind", 20)}<b>Yours</b>, Members-visible</li><li>${ic("flag")}Feeds Soulslike Summer</li><li>${ic("list")}6 games, 6 notes</li></ul></div>
  <div><h4>After you delete</h4><ul><li>${av(null, 20)}<b>The club's</b>, Members-visible</li><li>${ic("flag")}Still feeds Soulslike Summer</li><li>${ic("list")}Same games and notes, from Grindlord</li></ul></div></div>
  <div class="bt"><span class="btn gh">Keep my list</span><span class="btn dss">${ic("trash-2")}Delete, club keeps it</span></div>`);

/* ================= Surface 3 ================= */
const newHead = (ph, act = true) => `${back(ph)}<div class="hd"><h1>New list</h1>${act && !ph ? `<div class="act"><span class="btn gh">Cancel</span><span class="btn hl">${ic("check")}Create list</span></div>` : ""}</div>`;
const a3 = (ph) => `${newHead(ph)}<div class="rs" style="margin-top:22px">A <span class="rw open">ranked${ic("chevron-down")}</span> Game List called <span class="rw">Top 10 of all time</span>, seen by <span class="rw">members${ic("chevron-down")}</span>.</div>
  <div class="a3-pop"><div class="o on"><b>Ranked</b><span>Your order, numbered. Drag to change it.</span></div><div class="o"><b>A to Z</b><span>By title.</span></div><div class="o"><b>Date added</b><span>Newest first.</span></div></div>
  <div class="sec"><h2>About it</h2><span class="n lb">Optional</span></div><div class="fld area ${ph ? "" : "ph"}" style="max-width:760px">${ph ? "" : "What ties these games together?"}</div><span class="ctr" style="display:block;margin-top:6px">0 / 500</span>
  <div class="sec"><h2>First games</h2><span class="n lb">3 so far · add more any time</span></div><div class="fld" style="max-width:520px">${ic("search")}<span>Chrono</span><span class="caret"></span></div>
  <div class="a3-games">${["ct", "ff6", "p5r"].map((k, i) => `<span class="a3-g"><span class="n">${i + 1}</span><span class="x">${ic("x")}</span>${cover(k, ph ? 84 : 110)}</span>`).join("")}<span class="a3-games add" style="display:contents"><span class="add" style="width:${ph ? 84 : 110}px">${ic("plus")}</span></span></div>
  ${ph ? `<div style="display:flex;gap:8px;margin-top:22px"><span class="btn gh">Cancel</span><span class="btn hl" style="flex:1">${ic("check")}Create list</span></div>` : ""}`;
const b3 = (ph) => `${newHead(ph)}<div class="b3-wrap"><div class="b3-f">
  <div><div class="rowh"><span class="flab">Name</span><span class="ctr"><b>19</b> / 100</span></div><div class="fld focus">Top 10 of all time<span class="caret"></span></div></div>
  <div><div class="rowh"><span class="flab">Description, optional</span><span class="ctr">88 / 500</span></div><div class="fld area">The ten I'd hand anyone who asks. Rebuilt every New Year's Eve and argued about every time.</div></div>
  <div><span class="flab">Order</span><span class="seg"><span class="on">${ic("list-ordered")}Ranked</span><span>${ic("arrow-down-a-z")}A to Z</span><span>${ic("calendar-plus")}Date added</span></span></div>
  <div><span class="flab">Seen by</span><span class="seg"><span class="on">${ic("users")}Members</span><span>${ic("lock")}Only me (Private)</span></span></div>
  ${ph ? `<span class="btn hl">${ic("check")}Create list</span>` : ""}</div>
  <div class="b3-proof"><h4>How members will see it</h4><div class="pv"><h3>Top 10 of all time</h3>${byline({ ...T10, updated: "just now" })}<div class="empty" style="margin-top:14px">No games yet. You add them on the next page.</div></div>
  <p class="who">${ic("users")}<span>On /lists and on your profile. Private lists are seen only by you, staff included.</span></p></div></div>`;
const c3pool = ["ct", "ff6", "p5r", "disco", "bg3", "elden", "outer", "dq11", "metaphor", "hades", "yakuza0", "octo", "ff9", "ff10", "ff7", "liesofp"];
const c3on = ["ct", "ff6", "p5r", "disco"];
const c3 = (ph) => `${newHead(ph, false)}<p class="blurb" style="margin-top:14px">Pick the games first. Name it when you know what it is.</p>
  <div class="c3-q"><div class="fld focus">${ic("search")}<span>Popular with the club</span></div></div>
  <div class="c3-res">${c3pool.slice(0, ph ? 9 : 16).map((k) => `<div class="c3-r ${c3on.includes(k) ? "on" : ""}"><span class="pk">${ic(c3on.includes(k) ? "check" : "plus")}</span>${cover(k, 120)}<p>${G[k].t}</p><small>${G[k].y}</small></div>`).join("")}</div>
  <div class="c3-tray"><div class="n">4<small>picked</small></div><div><div class="f"><div><span class="flab">Name it</span><div class="fld focus">Top 10 of all time<span class="caret"></span></div></div>
  <div><span class="flab">Order and seen by</span><div style="display:flex;gap:6px"><span class="seg sm"><span class="on">Ranked</span><span>A to Z</span><span>Added</span></span><span class="seg sm"><span class="on" title="Members">${ic("users")}</span><span title="Private">${ic("lock")}</span></span></div></div>
  <span class="btn hl">${ic("check")}Create with 4 games</span></div><div class="st">${c3on.map((k) => cover(k, 30)).join("")}</div></div></div>`;

/* ================= page ================= */
page({
  title: "Lists pages",
  lede: `Options for the three <b>Game Lists</b> pages: the <b>/lists</b> index, a <b>Game List page</b> with its editor inline for the owner, and <b>/lists/new</b>. Every option carries one idea through every control. Mara (a Regular) is viewing; she owns <b>Top 10 of all time</b>. Grindlord owns <b>Soulslike, but make it history</b>, which feeds his Pool Challenge <b>Soulslike Summer</b>. Game Lists start in Preview, so the index carries the staff Preview chip. Covers are real Steam art; members are invented.`,
  keys: [["Today", "Tue 24 Nov 2026"], ["Viewer", "Mara, Regular"], ["Feature", "game_lists, Preview"], ["Yellow", "your own edits and calls to action"], ["Orange", "Delete"]],
  surfaces: [
    { id: "s1", title: "1 · /lists index", sub: "3 options · desktop, phone, search by a game",
      brief: `Club lists first, then members' lists, last updated first. One search box finds lists by name or by a game in them; picking a game from its suggestions turns it into a token and the results say where the game sits in each list.`,
      options: [
        { code: "1A", short: "Contents", title: "The contents page", idea: `A magazine's <b>contents page</b>. The club's lists are two feature panels with a fan of covers and a monumental count; members' lists are ruled rows with a five-cover strip. Searching by a game keeps the rows and adds a yellow line under each: <b>"Final Fantasy VI is No. 2 of 10"</b>.`,
          desk: ["Desktop · staff in Preview", desk(a1(0), "lists")], phone: ["Phone", phone(a1(1))], more: [["Search by a game: Final Fantasy VI", desk(a1q(), "lists")]] },
        { code: "1B", short: "Bookcase", title: "The bookcase", idea: `Lists are <b>books on two shelves</b>, the club's in paper binding and members' in ink, each spine as wide as its list is long, with the owner's initials and count at its foot. The picked spine lifts and its <b>slide-out</b> shows the first eight covers. Searching by a game greys out the spines without it and tags the rest with the game's rank.`,
          desk: ["Desktop", desk(b1(0), "lists")], phone: ["Phone", phone(b1(1))], more: [["Search by a game: Final Fantasy VI", desk(b1(0, 1), "lists")]] },
        { code: "1C", short: "Cover wall", title: "The cover wall", idea: `Each list is a <b>2 by 2 mosaic of its first covers</b> with the count stamped in a corner, five across; the club's lists run as wide cover bands across the top. Searching by a game moves that game into each mosaic's first slot, ringed yellow and tagged <b>No. 2</b>, and fades the lists without it.`,
          desk: ["Desktop", desk(c1(0), "lists")], phone: ["Phone", phone(c1(1))], more: [["Search by a game: Final Fantasy VI", desk(c1(0, 1), "lists")]] },
      ] },
    { id: "s2", title: "2 · A Game List page, editor inline", sub: "4 options · owner editing, a member reading, the takeover warning",
      brief: `For the owner the page is the editor: order (Ranked, A to Z, Date added), drag plus <b>Move up / Move down</b>, a note per game (280), Members or Private, Add and Remove a game, Delete, and <b>Start a Challenge from this list</b>. Everyone else reads it. When a list feeds a Challenge, deleting it or making it Private warns that <b>the club keeps a copy</b> (spec takeover). Each option shows Mara editing her Top 10 (a note open, a game being dragged), Mara reading Grindlord's list by date added, and Grindlord meeting the takeover warning.`,
      options: [
        { code: "2A", short: "Chart", title: "The chart", idea: `A <b>magazine chart</b>: ranked rows with monumental Anton numbers, the cover, the title and the note in italic. The owner's controls sit on the rows themselves (grip, Move up, Move down, pencil, remove) under one yellow-edged bar for order, visibility and Delete. A note opens in place with its counter; a dragged row lifts and a yellow line marks <b>Drop here · 6th</b>. The takeover is a plain confirm dialog.`,
          desk: ["Desktop · Mara edits her Top 10", desk(a2(0), "lists")], phone: ["Phone · Move up / Move down on every row", phone(a2(1))],
          more: [["A member reads Grindlord's list (Date added)", desk(a2ro(0), "lists")], ["Grindlord deletes a list that feeds a Challenge", a2tk()]] },
        { code: "2B", short: "Shelf", title: "The shelf", idea: `The list as <b>one shelf of spines</b>, the profile bookcase made bigger: 1 to 3 stand on a podium, the rest sit level in rank order. Picking a spine slides it out on the right as the editor for that game (its note with the counter, <b>Move up / Move down</b>, Remove). Order and visibility live in an editing strip above. Making it Private shows the two spines it becomes: yours, Private, and the club's copy.`,
          desk: ["Desktop · Disco Elysium picked", desk(b2(0), "lists")], phone: ["Phone", phone(b2(1))],
          more: [["A member reads Grindlord's list (Date added)", desk(b2ro(), "lists")], ["Grindlord makes a linked list Private", b2tk()]] },
        { code: "2C", short: "Ledger", title: "The ledger", idea: `A dense <b>ruled ledger</b>: rank, cover, game, note and date added as columns, each row with its grip and arrows; the note edits in its cell. Everything about the list sits in a <b>settings rail</b> on the right: order and Seen by as radio rows, Start a Challenge, and Delete, which arms in place as a dashed orange box that explains the takeover. On a phone the rail folds into a "List settings" bar.`,
          desk: ["Desktop · editing a note in its cell", desk(c2(), "lists")], phone: ["Phone", phone(c2ph())],
          more: [["A member reads Grindlord's list (Date added)", desk(c2ro(), "lists")], ["Grindlord arms Delete in the rail", c2tk()]] },
        { code: "2D", short: "Wall", title: "The numbered wall", idea: `A <b>wall of big covers with paper rank tags</b> pinned on their corners, the note under each. "Editing" adds a control strip under every cover (grip, Move up, Move down, note, remove); a note opens in a popover over the wall, and a dragged cover tilts out of a dashed yellow slot. Private is a switch. The takeover dialog compares <b>Now</b> and <b>After you delete</b> side by side.`,
          desk: ["Desktop · editing", desk(d2(0), "lists")], phone: ["Phone", phone(d2(1))],
          more: [["A member reads Grindlord's list (Date added)", desk(d2ro(), "lists")], ["Grindlord deletes a linked list", d2tk()]] },
      ] },
    { id: "s3", title: "3 · /lists/new", sub: "3 options · desktop and phone",
      brief: `Name (up to 100), an optional description (up to 500), Seen by (Members or Private) and the order. Lists may start empty.`,
      options: [
        { code: "3A", short: "Sentence", title: "One sentence", idea: `The Challenge form's <b>rule sentence</b> reused: "A <b>ranked</b> Game List called <b>Top 10 of all time</b>, seen by <b>members</b>." Each underlined word opens its choice beneath. The description and a first-games search sit under it, so a list can be born with games or empty.`,
          desk: ["Desktop · the order word open", desk(a3(0), "lists")], phone: ["Phone", phone(a3(1))] },
        { code: "3B", short: "Form + proof", title: "A short form with a proof", idea: `<b>Four plain fields</b> on the left with their counters, and a <b>proof</b> on the right showing the header members will see, updating as you type. Games are added on the list's own page after Create, which keeps this page tiny.`,
          desk: ["Desktop", desk(b3(0), "lists")], phone: ["Phone", phone(b3(1))] },
        { code: "3C", short: "Games first", title: "Games first", idea: `Start by <b>tapping covers</b> (search, or the club's popular games); each pick rings yellow and drops into a <b>tray</b> along the foot that counts them and asks for the name last. Create carries the games straight in, in the order picked.`,
          desk: ["Desktop · 4 picked", desk(c3(0), "lists")], phone: ["Phone", phone(c3(1))] },
      ] },
  ],
});
</script>
</body></html>
