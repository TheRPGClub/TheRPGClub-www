<!doctype html>
<html lang="en" data-mode="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pool Editor Options</title>
<meta name="description" content="Design options for the Pool editor and the Challenge page's Core and Optional Games, Pool Proposals and list notices (www#168).">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="kit.css">
<script src="kit.js"></script>
<style>
/* ---------- pool page additions ---------- */
.umber{--tint:#7a531c;--tint-hi:#e0b56e}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wall{display:grid;grid-template-columns:repeat(var(--cols,10),minmax(0,1fr));gap:14px 12px}
.wall .cv{width:100%!important}
.tile{min-width:0;position:relative}
.tile .marks{display:flex;gap:2px;margin-top:5px;min-height:18px;flex-wrap:wrap}
.tile .marks .av{--s:18px!important;width:18px;height:18px;font-size:8px}
.tile .marks .av.ip{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--fg)}
.tile .nm{font:700 .72rem/1.1 "Barlow Condensed";letter-spacing:.04em;text-transform:uppercase;color:var(--dim);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ktag{display:inline-flex;align-items:center;height:18px;padding:0 5px;border-radius:2px;font:800 .66rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;background:var(--fg);color:var(--bg)}
.ktag.core{background:var(--tint-hi);color:var(--bg)}
.ktag.ol{background:rgb(11 11 13/.8);color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.xbtn{display:grid;place-items:center;width:22px;height:22px;border-radius:2px;background:rgb(11 11 13/.78);color:var(--fg)}
.xbtn svg.lucide{width:13px;height:13px}
.addt{aspect-ratio:3/4;border:1.5px dashed var(--bs);border-radius:2.4px;display:grid;place-items:center;text-align:center;color:var(--faint);font:800 .78rem/1.2 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;padding:8px}
.addt svg.lucide{display:block;margin:0 auto 6px;width:20px;height:20px}
.wh{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--fg);padding-bottom:8px;margin:28px 0 14px;flex-wrap:wrap}
.wh h3{font:400 1.875rem/.9 Anton;text-transform:uppercase}
.wh .n{color:var(--faint)}
.wh .r{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--dim);font-size:.9rem}
.wh.sub{border-bottom-width:1px;border-color:var(--bs)}
.wh.sub h3{font-size:1.45rem}
.src{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.srcc{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 10px;border-radius:2.4px;background:var(--card);box-shadow:inset 0 0 0 1px var(--bs);font:700 .86rem/1 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase}
.srcc em{font-style:normal;color:var(--faint)}
.srcc svg.lucide{width:14px;height:14px;color:var(--faint)}
.srcc.dash{background:transparent;box-shadow:none;border:1.5px dashed var(--bs);color:var(--faint);padding:0 10px}
.tally{font:700 .8rem/1.3 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.tally b{color:var(--fg);font-weight:700}
.note{display:flex;gap:10px;align-items:flex-start;color:var(--dim);font-size:.92rem;line-height:1.45}
.note svg.lucide{color:var(--faint);margin-top:2px;width:16px;height:16px}
.dash-note{border:1px dashed var(--bs);border-radius:3px;padding:12px 14px}
.dash-note b{color:var(--fg);font-weight:600}
.stp{display:inline-flex;align-items:center;box-shadow:inset 0 0 0 1px var(--bs);border-radius:2.4px;height:36px}
.stp span{width:34px;height:100%;display:grid;place-items:center;color:var(--dim)}
.stp b{font:400 1.5rem/1 Anton;min-width:40px;text-align:center}
.stp.bad{box-shadow:inset 0 0 0 1.5px var(--dest)}
.stp.bad b{color:var(--dest)}
.err{color:var(--dest);font-size:.88rem;display:flex;gap:6px;align-items:center}
.err svg.lucide{width:15px;height:15px}
.fmt{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fmt div{background:var(--card);border-radius:3.2px;padding:14px 16px;box-shadow:inset 0 0 0 1px var(--border)}
.fmt div.on{box-shadow:inset 0 0 0 2px var(--hl)}
.fmt b{display:flex;align-items:center;gap:8px;font:400 1.5rem/1 Anton;text-transform:uppercase}
.fmt p{color:var(--dim);font-size:.9rem;margin-top:4px}
/* 8A columns */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1.25fr);gap:16px;align-items:start;margin-top:18px}
.colh{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--fg);padding-bottom:8px;margin-bottom:10px}
.colh h3{font:400 1.875rem/.9 Anton;text-transform:uppercase}
.colh .r{margin-left:auto}
.colh.core{box-shadow:0 2px 0 var(--tint-hi);border-color:var(--tint-hi)}
.led{border-top:1px solid var(--border)}
.lr{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}
.lr .t{flex:1;min-width:0;font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .y{color:var(--faint);font-size:.82rem;flex:none}
.lr .mv{flex:none}
.lr.sel{background:rgb(255 212 0/.08);box-shadow:inset 0 0 0 1px var(--hl);padding-left:6px;padding-right:6px}
.mid{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:180px;color:var(--faint)}
.owall{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 10px}
.owall .cv{width:100%!important}
/* 8B tile toggle */
.tog{display:flex;margin-top:6px;box-shadow:inset 0 0 0 1px var(--bs);border-radius:2px}
.tog span{flex:1;height:24px;display:grid;place-items:center;font:800 .62rem/1 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.tog span.c{background:var(--tint-hi);color:var(--bg);border-radius:2px}
.tog span.o{background:var(--fg);color:var(--bg);border-radius:2px}
.tile.core .cv{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--tint-hi)}
.tile.out .cv{opacity:.28;filter:grayscale(1)}
.lgd{display:flex;gap:16px;flex-wrap:wrap;font:700 .78rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.lgd i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:6px}
/* 8C sentence */
.rs .ct{font-style:normal;font:700 .9rem/1 "Barlow Condensed";letter-spacing:.06em;color:var(--faint);margin-left:4px;vertical-align:.15em}
.rs .add{color:var(--faint);font-weight:500;box-shadow:inset 0 -2px 0 var(--bs);border-bottom:0;white-space:nowrap}
.under{background:var(--card);border-radius:0 0 3.2px 3.2px;border-top:1px solid var(--bs);padding:18px 22px;margin-top:-4px}
.under .hint{color:var(--faint);font-size:.88rem;margin-bottom:12px}
.ledger2{columns:2;column-gap:28px}
.ledger2 .lr{break-inside:avoid}
/* challenge page */
.rules{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;margin-top:22px}
.facts{display:grid;grid-template-columns:96px 1fr;gap:8px 14px;font-size:.92rem;align-content:start}
.facts dt{font:700 .78rem/1.5 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.facts dd{margin:0;color:var(--fg)}
.facts dd a{text-decoration:underline;text-decoration-color:var(--tint-hi);text-underline-offset:3px;text-decoration-thickness:2px}
.rc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.rc{background:var(--card);border-radius:3.2px;padding:16px;position:relative}
.rc.you{box-shadow:inset 0 0 0 2px var(--hl)}
.rc .h{display:flex;align-items:center;gap:10px}
.rc .h b{font:400 1.45rem/1 Anton;text-transform:uppercase}
.rc .sc{margin-left:auto;text-align:right}
.rc .sc span{display:block;font:400 2.2rem/.9 Anton}
.rc .sc span em{font-style:normal;color:var(--faint);font-size:1.3rem}
.rc .sc small{font:700 .7rem/1 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.bars{margin-top:12px;display:grid;gap:8px}
.bar{display:grid;grid-template-columns:64px 1fr 42px;gap:8px;align-items:center}
.bar>span:first-child{font:700 .72rem/1 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.bar>b{font:400 1rem/1 Anton;text-align:right}
.bar>b em{font-style:normal;color:var(--faint)}
.segs{display:flex;gap:2px;height:8px}
.segs i{flex:1;background:var(--muted);border-radius:1px}
.segs i.on{background:var(--tint-hi)}
.segs i.ex{background:transparent;box-shadow:inset 0 0 0 1.5px var(--tint-hi)}
.rc .cvs{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap}
.rc .foot{display:flex;justify-content:space-between;margin-top:10px;font:700 .74rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.rc .stmp{position:absolute;right:14px;bottom:30px;font:400 1.1rem/1 Anton;text-transform:uppercase;color:var(--tint-hi);box-shadow:inset 0 0 0 2px var(--tint-hi);padding:5px 8px 3px;border-radius:2px;transform:rotate(-5deg);background:var(--card)}
.extra{font:700 .72rem/1.3 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-top:8px}
.extra b{color:var(--tint-hi);font-weight:700}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--hl);color:var(--bg);font:800 .74rem/1 "Barlow Condensed";vertical-align:.3em;margin-left:6px}
.prop{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.prop .t{font:400 1.3rem/1 Anton;text-transform:uppercase}
.prop .m{color:var(--dim);font-size:.88rem;margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prop .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tray{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px}
.tcard{background:var(--card);border-radius:3px;box-shadow:inset 0 0 0 1px var(--border),inset 0 4px 0 var(--hl);padding:18px 18px 14px}
.tcard.plain{box-shadow:inset 0 0 0 1px var(--border),inset 0 4px 0 var(--bs)}
.tcard .top{display:flex;align-items:flex-start;gap:12px}
.tcard .num{font:400 3.6rem/.8 Anton;color:var(--hl)}
.tcard.plain .num{color:var(--fg)}
.tcard .ti{font:800 .95rem/1.1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase}
.tcard .ln{color:var(--dim);font-size:.88rem;margin-top:3px}
.tcard .items{margin-top:12px;border-top:1px solid var(--border)}
.tcard .prop{grid-template-columns:48px minmax(0,1fr)}
.tcard .prop .a{grid-column:1/-1;justify-content:flex-start}
.split{display:flex;align-items:center;gap:12px;margin:18px 0 12px}
.split b{font:400 1.45rem/1 Anton;text-transform:uppercase}
.split .ln{flex:1;height:2px;background:var(--bs)}
.split small{font:700 .78rem/1 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.chk{display:grid;grid-template-columns:26px 36px minmax(0,1fr) auto 108px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
.chk .no{font:400 1.2rem/1 Anton;color:var(--faint);text-align:right}
.chk .t{font-weight:600}
.chk .t small{display:block;color:var(--faint);font-weight:400;font-size:.8rem}
.chk .st{display:flex;align-items:center;gap:6px;font:700 .76rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.chk .st.ok{color:var(--tint-hi)}
.chk .st.ip{color:var(--fg)}
.chk .mk{display:flex;gap:2px}
.chk .mk .av{width:20px!important;height:20px!important;font-size:8px}
.bslip{position:absolute;z-index:3;background:var(--fg);color:var(--bg);border-radius:2px;box-shadow:0 12px 30px rgb(0 0 0/.5);padding:12px 14px;width:300px}
.bslip h4{font:400 1.15rem/.95 Anton;text-transform:uppercase;margin-bottom:4px}
.bslip p{font-size:.86rem;color:rgb(11 11 13/.75);line-height:1.35}
.bslip p b{color:var(--bg)}
.bslip .row{margin-top:10px}
.made{display:inline-flex;align-items:center;gap:6px;font:700 .8rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;color:var(--fg);background:rgb(11 11 13/.7);padding:6px 8px;border-radius:2px}
.made a{text-decoration:underline;text-decoration-color:var(--tint-hi);text-decoration-thickness:2px;text-underline-offset:3px}
.made svg.lucide{width:14px;height:14px}
.ov{position:relative}
.ovl{position:absolute;inset:0;background:rgb(0 0 0/.62);z-index:4;display:grid;place-items:center;padding:24px}
.ovl .dlg{width:min(520px,100%)}
.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pick div{box-shadow:inset 0 0 0 1px var(--bs);border-radius:2.4px;padding:10px 12px}
.pick div.on{box-shadow:inset 0 0 0 2px var(--hl)}
.pick b{font:400 1.1rem/1 Anton;text-transform:uppercase;display:block}
.pick small{color:var(--dim)}
.lp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.lpc{background:var(--card);border-radius:3.2px;padding:14px;box-shadow:inset 0 0 0 1px var(--border)}
.lpc.on{box-shadow:inset 0 0 0 2px var(--hl)}
.lpc .fan{display:flex;margin-bottom:10px}
.lpc .fan .cv{margin-right:-14px;box-shadow:0 6px 14px rgb(0 0 0/.5)}
.lpc b{font:400 1.3rem/1 Anton;text-transform:uppercase;display:block}
.lpc small{color:var(--faint);font:700 .74rem/1.3 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase}
.pshell .rules{grid-template-columns:1fr;gap:16px}
.pshell .rc-grid{grid-template-columns:1fr}
.pshell .cols{grid-template-columns:1fr}
.pshell .tray{grid-template-columns:1fr}
.pshell .fmt{grid-template-columns:1fr}
.pshell .chk{grid-template-columns:24px 36px minmax(0,1fr) 70px}
.pshell .chk .mk{display:none}
.pshell .prop{grid-template-columns:48px minmax(0,1fr)}
.pshell .prop .a{grid-column:1/-1;justify-content:flex-start}
.pshell .vsw{gap:16px}
.pshell .vsw span{font-size:1.4rem}
.pshell .cbn .plate{position:static;align-self:flex-start;padding:8px 12px;gap:16px}
.pshell .cbn .plate b{font-size:2rem}
.pshell .lp{grid-template-columns:1fr}
</style></head><body>
<script>
/* ---------------- page data ---------------- */
game("dissidia", "Dissidia Final Fantasy NT", 2018, null);
game("ffcc", "Final Fantasy Crystal Chronicles Remastered", 2020, null);
const roman = { ff1: "I", ff2: "II", ff3: "III", ff4: "IV", ff5: "V", ff6: "VI", ff7: "VII", ff8: "VIII", ff9: "IX", ff10: "X", ff12: "XII", ff13: "XIII", ff15: "XV", ff16: "XVI" };
const MARA_CORE = ["ff1", "ff2", "ff3", "ff4", "ff5", "ff6", "ff7", "ff8", "ff9"];
const RUNS = [
  { m: "mara", core: 9, opt: 1, ip: ["ff10"], cl: ["ff7", "ff8", "ff9", "ff7r"], started: "Started 23 Sep", you: 1 },
  { m: "tavi", core: 14, opt: 3, cl: ["ff13", "ff15", "ff16", "cc", "t0", "wofs"], extra: 1, started: "Finished 18 Nov", fin: 1 },
  { m: "jun", core: 11, opt: 2, ip: ["ff12"], cl: ["ff9", "ff10", "ff7r", "ff7rb"], started: "Started 22 Sep" },
  { m: "rowan", core: 6, opt: 0, ip: ["ff7"], cl: ["ff4", "ff5", "ff6"], started: "Started 24 Sep" },
  { m: "owl", core: 3, opt: 0, ip: ["ff8"], cl: ["ff1", "ff2", "ff3"], started: "Started 2 Oct" },
  { m: "mog", core: 8, opt: 1, ip: ["ff13"], cl: ["ff10", "ff12", "ff9"], started: "Started 1 Oct" },
];
/* stable member marks per game (cleared, in progress) */
const marks = (k) => {
  let h = 0; for (const c of k) h = (h * 31 + c.charCodeAt(0)) % 997;
  const ks = Object.keys(M); const n = h % 5; const out = [];
  for (let i = 0; i < n; i++) out.push(ks[(h + i * 3) % ks.length]);
  return [...new Set(out)].map((m, i) => (i === 0 && h % 3 === 0 ? av(m, 18).replace('class="av"', 'class="av ip"') : av(m, 18))).join("");
};
const tname = (k) => (roman[k] ? "Final Fantasy " + roman[k] : G[k].t);

/* ---------------- shared bits ---------------- */
const asHost = (html, k) => html.replace(`${av("mara", 32)}<div><b>Mara</b><small>@mara</small></div>`, `${av(k, 32)}<div><b>${M[k].n}</b><small>@${k === "grind" ? "grindlord" : k} · Host</small></div>`);
const fmtCards = (locked) => `<div class="fmt">
  <div><b><i class="fsq" style="background:var(--f-slots)"></i>Slots</b><p>One game for every year in a range</p></div>
  <div class="on"><b><i class="fsq"></i>Pool</b><p>Clear games from a set you choose${locked ? ` ${ic("lock")}` : ""}</p></div>
  <div style="opacity:.55"><b><i class="fsq" style="background:#52cf98"></i>Assignment</b><p>Staff only</p></div></div>`;
const head = (t, act = "Create Challenge", back = "Challenges") => `<a class="back">${ic("arrow-left")}${back}</a><div class="hd"><h1>${t}</h1><div class="act"><span class="btn gh">Cancel</span><span class="btn hl">${act}</span></div></div>`;
const pHead = (t, act = "Create") => `<span class="pback">${ic("arrow-left")}</span><div class="hd"><h1>${t}</h1></div><div class="row" style="margin-top:10px"><span class="btn hl sm" style="flex:1">${act}</span><span class="btn gh sm">Cancel</span></div>`;
const srcRow = (o = {}) => `<div class="src">
  <span class="srcc">${ic("library-big")}Final Fantasy<em>Franchise · 31</em>${ic("x")}</span>
  <span class="srcc">${ic("layers")}Final Fantasy VII<em>Series · 9</em>${ic("x")}</span>
  ${o.list ? `<span class="srcc">${ic("list-ordered")}${o.list}<em>Game List</em>${ic("x")}</span>` : `<span class="srcc dash">${ic("plus")}Franchise, Series or Game List</span>`}
</div>`;
const addonLine = `<p class="note" style="margin-top:10px">${ic("info")}<span>Sources only add Optional Games. Add-ons (DLC, expansions) never come in by themselves; add one by hand.</span></p>`;
const lockNote = (n = 9) => `<div class="dash-note note">${ic("lock")}<span><b>Format and Season are locked</b> because ${n} Runs have started. Core and Optional Games, sources and the target stay editable. Adding a Core Game or raising the target sends a DM to the 8 members with an active Run.</span></div>`;
const stepper = (v, bad) => `<span class="stp ${bad ? "bad" : ""}"><span>${ic("minus")}</span><b>${v}</b><span>${ic("plus")}</span></span>`;
const alsoAdd = (game, list) => `<div class="dlg"><h3>Also add to the list?</h3><p class="dim">${esc(G[game].t)} joins the Pool as an Optional Game. <b style="color:var(--fg)">${esc(list)}</b> feeds this Challenge, so you can add it there too.</p>
  <div class="row" style="margin-top:14px;gap:16px">${cover(game, 64)}<div><span class="sw"><span class="t"></span><span class="lb">Also add to ${esc(list)}</span></span><p class="faint" style="font-size:.85rem;margin-top:6px">Leave it off to keep your list as it is.</p></div></div>
  <div class="bt"><span class="btn gh">Cancel</span><span class="btn hl">Add to the Pool</span></div></div>`;
const ovl = (bg, dlg, h) => `<div class="ov" style="min-height:${h || 560}px">${bg}<div class="ovl">${dlg}</div></div>`;
const listPick = (sel = "souls") => {
  const card = (k, on) => { const L = LISTS[k]; return `<div class="lpc ${on ? "on" : ""}"><div class="fan">${L.games.slice(0, 4).map(([g]) => cover(g, 54)).join("")}</div><b>${L.name}</b><small>${L.count || L.games.length} games · ${L.vis === "private" ? "Private" : "Members"}</small></div>`; };
  return `<div class="lp">${card("souls", sel === "souls")}${card("top10")}${card("ffmain")}</div>`;
};

/* ================= 8A: two columns ================= */
const ledRow = (k, i, side, sel) => `<div class="lr ${sel ? "sel" : ""}">${cover(k, 30)}<span class="t">${esc(tname(k))}</span><span class="y">${G[k].y}</span>
  <span class="btn xs ic mv" title="${side === "core" ? "Make Optional" : "Make Core"}">${ic(side === "core" ? "arrow-right" : "arrow-left")}</span><span class="btn xs ic gh mv" title="Leave out">${ic("x")}</span></div>`;
const optTile = (k, o = {}) => `<div class="tile">${cover(k, 80, { tag: FOFF.newOpt.includes(k) ? `<span class="new">New</span>` : o.hand ? `<span class="ktag">Added</span>` : "", tr: `<span class="xbtn">${ic("arrow-left")}</span>` })}<div class="nm">${esc(G[k].t)}</div></div>`;
