<!doctype html>
<html lang="en" data-mode="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Franchise page and edit tab</title>
<meta name="description" content="Design options for the Franchise page and the Franchises tab on the Game Edit page (www#168).">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="kit.css">
<script src="kit.js"></script>
<style>
/* ---------- shared bits for this page ---------- */
.src{display:inline-flex;align-items:center;gap:4px;font:700 .7rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.src svg.lucide{width:12px;height:12px}
.src.man{color:var(--dim)}
.hist li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--border);font-size:.9rem;color:var(--dim);line-height:1.35}
.hist li b{color:var(--fg);font-weight:600}
.hist li small{display:block;font:700 .72rem/1.3 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-top:3px}
.hist li.undone{opacity:.55}
.hist li.undone .what{text-decoration:line-through;text-decoration-color:var(--faint)}
.hist .na{font:700 .7rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;color:var(--faint);white-space:nowrap;padding-top:3px}
.menu{background:var(--card);border:1px solid var(--bs);border-radius:3.2px;box-shadow:0 12px 30px rgb(0 0 0/.5);padding:6px;min-width:220px}
.menu div{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:2.4px;font:700 .92rem/1 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.menu div.on{background:var(--muted);color:var(--fg)}
.menu div.ds{color:var(--dest)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 2px}
.res{background:var(--card);border:1px solid var(--bs);border-top:0;border-radius:0 0 3.2px 3.2px;box-shadow:0 12px 30px rgb(0 0 0/.5)}
.res>div{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border);font-size:.92rem}
.res>div:last-child{border-bottom:0}
.res>div.on{background:var(--muted)}
.res>div small{color:var(--faint);font:700 .72rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;margin-left:auto;white-space:nowrap}
.res>div .btn{margin-left:6px}
.res>div.mk{color:var(--dim)}
.mini-sw{display:inline-flex;align-items:center;gap:8px;font:700 .74rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.mini-sw .t{width:32px;height:18px;border-radius:3px;background:var(--hl);position:relative}
.mini-sw .t::after{content:"";position:absolute;top:2px;left:16px;width:14px;height:14px;border-radius:2px;background:var(--bg)}
.mini-sw.off .t{background:var(--muted);box-shadow:inset 0 0 0 1px var(--bs)}
.mini-sw.off .t::after{left:2px;background:var(--faint)}
.mark{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:2px;font:800 .68rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.mark.ed{box-shadow:inset 0 0 0 1.5px var(--hl);color:var(--hl)}
.mark.add{background:var(--hl);color:var(--bg)}
.mark.rm{box-shadow:inset 0 0 0 1.5px var(--dest);color:var(--dest)}
.undo{display:inline-flex;align-items:center;gap:4px;font:800 .74rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;color:var(--fg);text-decoration:underline;text-decoration-color:var(--gotm);text-decoration-thickness:2px;text-underline-offset:3px;white-space:nowrap}
.undo svg.lucide{width:12px;height:12px}
.overlay{position:relative}
.overlay .scrim{z-index:5}
.overlay .pop{position:absolute;z-index:6}
.fhd-sub{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font:700 .8rem/1.2 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.fhd-sub b{color:var(--fg);font-weight:700}

/* ---------- 6A ledger ---------- */
.lg{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:32px;align-items:start}
.lr{display:grid;grid-template-columns:34px 34px minmax(0,1fr) 46px 96px auto;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);min-height:52px}
.lr .no{font:400 1.25rem/1 Anton;color:var(--faint);text-align:right}
.lr .ti{font-weight:600;line-height:1.2;min-width:0}
.lr .ti small{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font:700 .72rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.lr .ti small svg.lucide{width:13px;height:13px}
.lr .yr{color:var(--faint);font-size:.9rem}
.lr .ctl{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.lr.sub{min-height:36px;padding:3px 0;grid-template-columns:34px 34px minmax(0,1fr) 46px 96px auto}
.lr.sub .ti{font-weight:500;color:var(--dim);font-size:.92rem;display:flex;align-items:center;gap:8px}
.lr.sub .ti svg.lucide{width:14px;height:14px;color:var(--faint)}
.lr.ro{grid-template-columns:34px 34px minmax(0,1fr) 46px 96px}
.lr.mob .ti{color:var(--dim)}
.lr.out{opacity:.5}
.lr.out .ti{text-decoration:line-through}
.pl .lr{grid-template-columns:26px 30px minmax(0,1fr) auto;gap:10px;min-height:46px}
.pl .lr .no{font-size:1rem}
.pl .lr.sub{grid-template-columns:26px 30px minmax(0,1fr)}
.margin{position:sticky;top:0}
.margin .sec{margin-top:0}

/* ---------- 6B shelf ---------- */
.run{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:22px 14px}
.run .it{min-width:0;position:relative}
.run .it .cv{width:100%!important}
.run .num{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px;gap:6px}
.run .num b{font:400 1.7rem/.9 Anton}
.run .num span{color:var(--faint);font-size:.82rem}
.ins{display:inline-flex;align-items:center;gap:4px;margin-top:6px;background:var(--fg);color:var(--bg);font:800 .68rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;padding:4px 6px 3px;border-radius:2px;transform:rotate(-2deg)}
.ins svg.lucide{width:11px;height:11px}
.ins.open{background:var(--hl)}
.drawer{grid-column:1/-1;background:var(--card);border-radius:3.2px;padding:12px 16px;display:flex;gap:14px;align-items:center;box-shadow:inset 0 0 0 1px var(--border)}
.drawer .lb{color:var(--faint);white-space:nowrap}
.drawer .ad{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;background:var(--muted);border-radius:2.4px;font-size:.92rem}
.drawer .ad .cv{width:30px!important}
.box{background:var(--card);border:1px solid var(--border);border-radius:3.2px;padding:18px 20px 20px}
.box .wall{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:14px 10px}
.box .wall .it{min-width:0}
.box .wall .it .cv{width:100%!important}
.box .wall p{font-size:.78rem;line-height:1.2;color:var(--dim);margin-top:5px}
.box .wall p small{display:block;color:var(--faint);font-size:.72rem}
.editing{box-shadow:inset 0 0 0 2px var(--hl);border-radius:3.2px;padding:16px}
.tok{position:absolute;top:6px;z-index:2;width:26px;height:26px;border-radius:2px;display:grid;place-items:center;background:rgb(11 11 13/.8);color:var(--fg)}
.tok svg.lucide{width:14px;height:14px}
.tok.x{right:6px}
.tok.mv{left:6px}
.tok.on{background:var(--fg);color:var(--bg)}
.addtile{border:1.5px dashed var(--bs);border-radius:2.4px;aspect-ratio:3/4;display:grid;place-items:center;text-align:center;color:var(--dim);font:800 .8rem/1.2 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;padding:8px}
.addtile svg.lucide{display:block;margin:0 auto 6px;width:20px;height:20px}
.gone{opacity:.32;filter:grayscale(1)}
.run.p{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 10px}
.run.p .num b{font-size:1.3rem}
.box.p .wall{grid-template-columns:repeat(4,minmax(0,1fr))}
.tline{list-style:none}
.tlr{display:grid;grid-template-columns:110px 22px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:.94rem;color:var(--dim)}
.tlr .when{font:700 .78rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.tlr b{color:var(--fg);font-weight:600}
.tlr.undone{opacity:.55}.tlr.undone .what{text-decoration:line-through}

/* ---------- 6C timeline ---------- */
.trunk{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 84px minmax(0,1fr);row-gap:0}
.trunk::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--fg);transform:translateX(-1px)}
.trunk .yr{grid-column:2;text-align:center;font:400 1.15rem/1 Anton;color:var(--fg);background:var(--bg);align-self:center;position:relative;z-index:1;padding:4px 0}
.trunk .L1{grid-column:1;display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding:10px 0}
.trunk .R1{grid-column:3;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px 0}
.mn{display:flex;align-items:center;gap:12px;flex-direction:row-reverse;text-align:right;position:relative}
.mn .nm{font:400 1.5rem/.92 Anton;text-transform:uppercase}
.mn .nm small{display:block;font:700 .72rem/1.2 "Barlow Condensed";letter-spacing:.07em;color:var(--faint);margin-top:4px}
.mn .ed{position:absolute;left:-36px;top:50%;transform:translateY(-50%)}
.on-node{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--hl);border-radius:2.4px}
.ot{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--dim)}
.ot b{color:var(--fg);font-weight:600}
.ot .cv{width:30px!important}
.adn{display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin-right:72px;border-right:1px dashed var(--faint);padding-right:10px}
.adn span{font:700 .74rem/1.2 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;color:var(--dim);display:inline-flex;gap:5px;align-items:center}
.adn span svg.lucide{width:12px;height:12px;color:var(--faint)}
.nodepop{background:var(--card);border:1px solid var(--bs);border-radius:3.2px;box-shadow:0 12px 30px rgb(0 0 0/.5);padding:14px;width:300px}
.nodepop h4{font:400 1.3rem/.95 Anton;text-transform:uppercase;padding-bottom:8px;border-bottom:2px solid var(--fg);margin-bottom:10px}
.nodepop .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.ptrunk{position:relative;padding-left:58px}
.ptrunk::before{content:"";position:absolute;left:40px;top:0;bottom:0;width:2px;background:var(--fg)}
.ptrunk .py{position:absolute;left:0;width:36px;text-align:right;font:400 .95rem/1 Anton}
.ptrunk .pe{position:relative;padding:8px 0;display:flex;align-items:center;gap:10px;min-height:52px}
.ptrunk .pe::before{content:"";position:absolute;left:-22px;top:50%;width:12px;height:2px;background:var(--fg)}
.ptrunk .pe.o::before{background:var(--faint);width:8px}
.ptrunk .pe .t{font:400 1.15rem/.95 Anton;text-transform:uppercase}
.ptrunk .pe.o .t{font:600 .9rem/1.2 Barlow;text-transform:none;color:var(--dim)}

/* ---------- 7 edit band ---------- */
.band{position:relative;margin:-24px -28px 0;height:200px;overflow:hidden;background:var(--card)}
.band .art{opacity:.9}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgb(11 11 13/.96) 0%,rgb(11 11 13/.85) 45%,rgb(11 11 13/.35) 100%)}
.band .in{position:absolute;inset:0;z-index:1;padding:18px 28px 0;display:flex;flex-direction:column}
.band .tt{display:flex;align-items:center;gap:16px;margin-top:6px}
.band .tt h1{font:400 2.6rem/.88 Anton;text-transform:uppercase}
.band .tabs{display:flex;gap:26px;margin-top:auto}
.band .tabs span{font:400 1.35rem/1 Anton;text-transform:uppercase;color:var(--faint);padding-bottom:6px;position:relative;white-space:nowrap}
.band .tabs span small{display:block;font:800 .66rem/1 "Barlow Condensed";letter-spacing:.07em;color:var(--hl);margin-top:3px;height:.66rem}
.band .tabs span.on{color:var(--fg)}
.band .tabs span.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--gotm)}
.pshell .band{margin:-20px -16px 0;height:190px}
.pshell .band .in{padding:14px 16px 0}
.pshell .band .tt h1{font-size:1.75rem}
.pshell .band .tabs{gap:20px;overflow:hidden}
.pshell .band .tabs span{font-size:1.15rem}
.esh{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--fg);padding:22px 0 8px;flex-wrap:wrap}
.esh h2{font:400 1.65rem/1 Anton;text-transform:uppercase}
.esh .st{font:800 .72rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;color:var(--hl)}
.esh .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.series{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);color:var(--dim);font-size:.92rem;flex-wrap:wrap}
.series .lb{color:var(--faint);width:88px}
.series b{color:var(--fg);font-weight:600}
.fr7{display:grid;grid-template-columns:minmax(0,1.4fr) 100px 210px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.fr7 .fn{font:400 1.25rem/1 Anton;text-transform:uppercase}
.fr7 .fn small{display:block;font:700 .72rem/1.3 "Barlow Condensed";letter-spacing:.07em;color:var(--faint);margin-top:4px}
.fr7.st{background:rgb(255 212 0/.06);padding-left:12px;padding-right:8px}
.fr7.rm .fn{text-decoration:line-through;text-decoration-color:var(--dest);color:var(--dim)}
.fr7 .marks{display:flex;align-items:center;gap:10px}
.savebar{display:flex;align-items:center;gap:14px;margin-top:22px;padding:12px 16px;background:var(--card);box-shadow:inset 0 2px 0 var(--hl);border-radius:3px}
.savebar b{font:400 2.4rem/.85 Anton;color:var(--hl)}
.savebar .w{font:800 .86rem/1.2 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase}
.savebar .w small{display:block;color:var(--faint);font-weight:700;font-size:.74rem;letter-spacing:.05em}
.savebar .r{margin-left:auto;display:flex;gap:8px}
.ftok-wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.ftok{background:var(--card);border-radius:3.2px;box-shadow:inset 0 0 0 1px var(--border);padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:150px}
.ftok .h{display:flex;align-items:flex-start;gap:10px}
.ftok .h b{font:400 1.45rem/.92 Anton;text-transform:uppercase;flex:1}
.ftok .ft{margin-top:auto;display:flex;align-items:center;gap:10px;border-top:1px solid var(--border);padding-top:10px}
.ftok .ft .tl{margin-left:auto}
.star{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:2.4px;font:800 .8rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;box-shadow:inset 0 0 0 1px var(--bs);color:var(--dim)}
.star svg.lucide{width:14px;height:14px}
.star.on{background:var(--fg);color:var(--bg);box-shadow:none}
.ftok.newt{border:1.5px dashed var(--bs);box-shadow:none;background:none;justify-content:center;align-items:stretch}
.toast{display:flex;align-items:center;gap:12px;background:var(--fg);color:var(--bg);border-radius:2px;padding:10px 14px;box-shadow:0 12px 30px rgb(0 0 0/.5);font-size:.92rem;width:max-content;max-width:100%}
.toast .undo{color:var(--bg)}
.toast svg.lucide{width:16px;height:16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px}
.col{background:var(--card);border-radius:3.2px;padding:14px 16px 16px;box-shadow:inset 0 0 0 1px var(--border)}
.col>h3{font:400 1.5rem/1 Anton;text-transform:uppercase;padding-bottom:6px;border-bottom:2px solid var(--fg);display:flex;align-items:baseline;gap:10px}
.col>h3 small{font:700 .76rem/1 "Barlow Condensed";letter-spacing:.08em;color:var(--faint)}
.col>p{font-size:.86rem;color:var(--faint);margin:8px 0 6px}
.crow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.crow:last-child{border-bottom:0}
.crow b{font:400 1.15rem/1 Anton;text-transform:uppercase;flex:1;min-width:0}
.crow b small{display:block;font:700 .7rem/1.3 "Barlow Condensed";letter-spacing:.07em;color:var(--faint);margin-top:3px}
.crow.st{background:rgb(255 212 0/.06);padding-left:10px;padding-right:6px}
.col.dropon{box-shadow:inset 0 0 0 2px var(--hl)}
.ghost{border:1.5px dashed var(--hl);border-radius:2.4px;height:44px;display:flex;align-items:center;justify-content:center;font:800 .78rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;color:var(--hl);margin-top:8px}
</style>
</head>
<body>
<script>
/* ---------- data: the Final Fantasy Franchise ---------- */
const MAIN = ["ff1","ff2","ff3","ff4","ff5","ff6","ff7","ff8","ff9","ff10","ff11","ff12","ff13","ff14","ff15","ff16"];
const OTHER = ["ffmq","ff10_2","ff13_2","lr","ffrk","ffbe","mobius","t0","wofs","ff7r","cc","sop","theatr","ff7rb","fft"];
const ADDONS = { ff14:["ff14_ew","ff14_dt"], ff15:["ff15_glad","ff15_prom","ff15_ign"], ff16:["ff16_eotf","ff16_trt"], ff7r:["ff7r_int"] };
const MANUAL = { fft:"rowan", ff16_trt:null };
const ROMAN = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI"];
const short = (k)=>{const i=MAIN.indexOf(k);return i>=0?ROMAN[i]:G[k].t;};
const src = (k)=> MANUAL[k]!==undefined ? `<span class="src man">${ic("pencil")}Linked by ${who(MANUAL[k]||"rowan")}</span>` : `<span class="src">${ic("database")}IGDB</span>`;
const HIST = [
  {w:"rowan",a:`linked <b>Final Fantasy Tactics: The Ivalice Chronicles</b>`,t:"2 days ago",u:1},
  {w:"jun",a:`marked <b>Final Fantasy XVI</b> Mainline`,t:"3 days ago",u:1},
  {w:"mog",a:`unlinked <b>Kingdom Hearts III</b>`,t:"5 days ago",u:1},
  {w:"rowan",a:`unlinked <b>Final Fantasy Brave Exvius</b>`,t:"6 days ago",u:"undone",by:"Rowan"},
  {w:"loot",a:`merged <b>Final Fantasy (Square)</b> into this Franchise`,t:"2 weeks ago",u:0},
  {w:"loot",a:`renamed <b>Final Fantasy series</b> to <b>Final Fantasy</b>`,t:"2 weeks ago",u:1},
  {w:"jun",a:`marked <b>Final Fantasy</b> to <b>Final Fantasy XV</b> Mainline (15 games)`,t:"2 weeks ago",u:1},
];
const histList = (canUndo=true, n=HIST.length) => `<ul class="hist">${HIST.slice(0,n).map(h=>`<li class="${h.u==="undone"?"undone":""}">${av(h.w,22)}<div><span class="what"><b>${who(h.w)}</b> ${h.a}</span><small>${h.t}${h.u==="undone"?` · undone by ${h.by}`:""}</small></div>${h.u===1&&canUndo?`<span class="undo">${ic("undo-2")}Undo</span>`:h.u===0?`<span class="na">Can't undo</span>`:"<span></span>"}</li>`).join("")}</ul>`;
const startBtn = `<span class="btn hl">${ic("flag")}Start a Challenge</span>`;
const fhead = (act, o={}) => `<a class="back">${ic("arrow-left")}Games</a><div class="hd"><h1>${o.name||"Final Fantasy"}</h1><span class="n lb">Franchise</span><div class="act">${act}</div></div>
  <div class="fhd-sub"><span><b>16</b> Mainline</span><span><b>15</b> Other</span><span><b>8</b> Add-ons</span><span>From IGDB, 2 manual changes</span></div>`;
const phead = (act="") => `<a class="pback" aria-label="Back to Games">${ic("arrow-left")}</a><div class="hd"><h1>Final Fantasy</h1></div>
  <div class="fhd-sub"><span><b>16</b> Mainline</span><span><b>15</b> Other</span><span><b>8</b> Add-ons</span></div>${act?`<div style="display:flex;gap:8px;margin-top:14px">${act}</div>`:""}`;
const searchOpen = (ph="Link a game", q="Tactics") => `<div style="position:relative;width:340px"><div class="fld focus">${ic("search")}${q}<span class="caret"></span></div>
  <div class="res" style="position:absolute;left:0;right:0;top:36px;z-index:4">
  <div class="on">${cover("fft",28)}<span>Final Fantasy Tactics: The Ivalice Chronicles</span><small>2025</small></div>
  <div>${cover("ffmq",28,{fs:5})}<span>Final Fantasy Tactics Advance</span><small>2003</small></div>
  <div class="mk">${ic("check")}<span>Final Fantasy Tactics A2</span><small>Already linked</small></div></div></div>`;

/* ================= 6A: the annotated ledger ================= */

  <div class="savebar"><b>2</b><span class="w">Unsaved changes<small>Franchises 2</small></span><span class="r"><span class="btn">Discard</span><span class="btn hl">${ic("check")}Save all</span></span></div>`,"games",{h:700});

  <div style="border:1.5px dashed var(--dest);border-radius:3px;padding:12px 14px;margin-top:14px;color:var(--dim);font-size:.94rem">${ic("triangle-alert")} <b style="color:var(--fg)">Midgar Chronicles</b> was merged into Compilation of Final Fantasy VII while you edited. Your other change is still staged.</div>${c7cols(false,false)}`,"games",{h:640});

page({

  lede: `Options for the members-only <b>Franchise page</b> (/franchises/[id]) and the <b>Franchises tab</b> on the Game Edit page (spec api#442, www#168). The example is IGDB's <b>Final Fantasy</b> Franchise after a little cleanup: 16 Mainline games (XI and XIV included: they are Mainline even though Fall of Final Fantasy leaves them out), 15 Other games (spin-offs, remakes, and the mobile entries a Regular might unlink) and 8 Add-ons nested under their parent game. Members read; <b>Regulars</b> link, unlink, set Mainline and create Franchises; <b>Admins</b> also rename, merge and delete. Every change goes into the history, and link, unlink, Mainline and rename undo in one click. IGDB "collections" show as <b>Series</b>, read only. Today is Tue 24 Nov 2026; members are invented.`,
  keys: [["Viewer","Mara (Regular) unless a frame says otherwise"],["Yellow","your edits, staged changes, Start a Challenge"],["Signal orange","unlink and delete"],["Mark","IGDB or Manual, quietly"]],

      options: [
        { code:"6A", short:"Ledger", title:"The annotated ledger", idea:`A numbered <b>ledger</b> of the Franchise, one ruled row per game (number, cover, title, year, IGDB or Manual), Mainline then Other. Add-ons fold under their parent behind "2 Add-ons" and open as indented rows. The <b>history runs in the right margin</b> beside the rows it changed, with Undo on each line. A Regular gets a Mainline switch and an Unlink on every row and a "Link a game" search on the Mainline rule; Admins get a "Franchise" menu (Rename, Merge, Delete).`,
          desk:["Desktop · Regular editing, XVI and VII Remake opened to their Add-ons", a6desk(true)],
          phone:["Phone · Member reading", a6phone()],
          more:[["Admin · the Franchise menu", a6admin()],["Admin · Merge into another Franchise", a6merge()],["Member · desktop, read only, no switches", `<div style="max-height:1150px;overflow:hidden">${a6desk(false)}</div>`]],
          notes:[`<b>Densest option:</b> every fact (number, year, source) is a column, so a cleanup pass reads top to bottom.`,`The Mainline number is the row's order in the Franchise by release year, not a stored rank.`] },
        { code:"6B", short:"Shelf", title:"The numbered run and the box set", idea:`The Mainline games stand as <b>the numbered run</b>: big covers with their Roman numeral in Anton, release order. Add-ons are <b>paper inserts</b> clipped under their parent's cover; opening one slides out a drawer row. Everything else sits in <b>the box set</b>, a panel of smaller covers. "Edit Franchise" opens the whole page as an editor (the yellow rule): every cover gets a star (Mainline) and an x (Unlink), and the last tile is the dashed "+ Link a game". The history is its own department below.`,
          desk:["Desktop · Regular in edit mode, Mobius being unlinked", b6desk()],
          phone:["Phone · Member reading", b6member()],

          notes:[`<b>Most visual:</b> covers carry the page, matching the Pool wall on Challenge pages.`,`Moving a game between Mainline and Other is the star; it saves at once and lands in the history.`] },

          desk:["Desktop · Regular, Final Fantasy XI's node open (1987 to 2009)", c6desk()],

          more:[["Desktop · History view", c6hist()],["Desktop · Link a game, link as Other or Mainline", c6link()]],
          notes:[`<b>Best for telling the story</b> of a long Franchise; sparse years leave air, crowded ones stack.`,`Uses only release years, so no invented "child of" links between Other games and Mainline ones.`] },
      ] },
    { id:"s7", title:"7 · Franchises tab", sub:"/games/[id]/edit · 3 options", brief:`A seventh masthead tab on the Game Edit page, for Regulars and above (a Regular sees Game Threads and Franchises only, as on the phones below). The game is <b>Final Fantasy VII Remake</b>: Mainline in Compilation of Final Fantasy VII, Other in Final Fantasy, and an IGDB mistake (Kingdom Hearts) to unlink. The Series line is IGDB's collection, read only.`,
      options: [
        { code:"7A", short:"Rows", title:"Staged rows, Save all", idea:`One <b>ruled row per Franchise</b>: name, game count, source, a <b>Mainline / Other</b> segmented control and Unlink. Like every other tab it <b>stages</b>: changed rows carry Edited, Added or Removing with an Undo, the tab reads "3 staged" and the sticky <b>Save all</b> bar saves them with the rest of the page.`,
