<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Lists Options</title>
<meta name="description" content="Design options for Game Lists, Franchise pages and the Core and Optional Pool on the website (www#168).">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="kit.css">
<style>
.grp{margin-top:56px}
.grp>h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;font:400 2.6rem/.9 Anton;text-transform:uppercase;padding-bottom:10px;border-bottom:2px solid var(--fg)}
.grp>h2 a:hover{color:var(--hl)}
.grp>h2 small{font:700 .9rem/1 "Barlow Condensed";letter-spacing:.08em;color:var(--faint)}
.grp>h2 .open{margin-left:auto;font:800 .9rem/1 "Barlow Condensed";letter-spacing:.07em;color:var(--dim);display:inline-flex;align-items:center;gap:6px;text-decoration:underline;text-decoration-color:var(--gotm);text-decoration-thickness:2px;text-underline-offset:4px}
.grp>h2 .open:hover{color:var(--hl)}
.sfs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,720px),1fr));gap:32px 36px;margin-top:22px}
.sf h3{font:400 1.6rem/.95 Anton;text-transform:uppercase}
.sf .sub{font:700 .78rem/1.3 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:6px}
.thumbs{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:10px;margin-top:14px}
.thumbs a{display:block;position:relative;border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--bs);aspect-ratio:16/10;background:var(--card)}
.thumbs a img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
.thumbs a b{position:absolute;left:0;top:0;background:var(--bg);color:var(--hl);font:400 1.25rem/1 Anton;padding:5px 8px 4px;border-radius:0 0 3px 0}
.thumbs a:hover{box-shadow:inset 0 0 0 2px var(--hl)}
.ol{margin-top:14px}
.ol li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--border);line-height:1.45;color:var(--dim)}
.ol li>a{font:400 1.25rem/1.1 Anton;color:var(--hl)}
.ol li b{color:var(--fg);font-weight:600}
.ol li a.pp{font:700 .76rem/1 "Barlow Condensed";letter-spacing:.07em;text-transform:uppercase;color:var(--faint);text-decoration:underline;text-underline-offset:3px;margin-left:6px}
.decided{margin-top:64px}
.decided>h2{font:400 2.6rem/.9 Anton;text-transform:uppercase;padding-bottom:10px;border-bottom:2px solid var(--fg);display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
.decided>h2 small{font:700 .9rem/1 "Barlow Condensed";letter-spacing:.08em;color:var(--faint)}
.decided ul{margin-top:12px;max-width:100ch}
.decided li{padding:8px 0;border-top:1px solid var(--border);color:var(--dim);line-height:1.5}
.decided li b{color:var(--fg);font-weight:600}
.botcard{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-top:22px;padding:18px 20px;border:1px solid var(--bs);border-radius:3px}
.botcard p{color:var(--dim);max-width:80ch;flex:1 1 380px}
.botcard p b{color:var(--fg);font-weight:600}
</style></head>
<body><div class="gx" id="root"></div>
<script>
/* one-liners per option; codes match the anchors on each page (#o1a ...) */
const GROUPS = [
  { title: "Lists pages", href: "lists.html", sub: "/lists · a Game List page · /lists/new", surfaces: [
    { t: "1 · /lists index", s: "Club lists first, then members' lists; search by name or by a game", o: [{"c": "1A", "n": "The contents page", "d": "Club lists on feature panels with a cover fan and a big count; members' lists as ruled rows with five covers. Searching by a game adds \"Final Fantasy VI is No. 2 of 10\" under each row."}, {"c": "1B", "n": "The bookcase", "d": "Lists are spines on a club shelf and a members' shelf, as wide as the list is long; the picked spine slides out with its covers. Searching by a game greys the spines without it."}, {"c": "1C", "n": "The cover wall", "d": "Each list is a 2 by 2 mosaic with its count stamped in a corner, club lists as wide cover bands on top. Searching by a game moves it into each mosaic's first slot, ringed yellow."}] },
    { t: "2 · A Game List page, editor inline", s: "Sort modes, drag and Move up / down, notes, visibility, delete with the takeover warning", o: [{"c": "2A", "n": "The chart", "d": "Ranked rows with big Anton numbers and the tools on every row (grip, Move up and down, note, remove) under one bar for order, visibility and Delete; the takeover is a plain confirm."}, {"c": "2B", "n": "The shelf", "d": "The list is one shelf of spines with 1 to 3 on a podium; the picked spine slides out as that game's editor. Making it Private is drawn as the two spines it becomes."}, {"c": "2C", "n": "The ledger", "d": "A dense ruled table (rank, cover, game, note, date added) with notes edited in their cell and a settings rail; Delete arms in place as a dashed orange box explaining the takeover."}, {"c": "2D", "n": "The numbered wall", "d": "Big covers with paper rank tags; editing adds a control strip under each cover and a note popover. The takeover dialog compares Now with After you delete."}] },
    { t: "3 · /lists/new", s: "Name, description, visibility, sort and the first games", o: [{"c": "3A", "n": "One sentence", "d": "The Challenge form's rule sentence reused: \"A [ranked] Game List called [name], seen by [members].\" Description and a first-games search under it."}, {"c": "3B", "n": "A short form with a proof", "d": "Four fields with counters beside a live preview of the header members will see; games are added on the list's page after Create."}, {"c": "3C", "n": "Games first", "d": "Tap covers to pick them into a yellow-edged tray, then name, order and visibility last: \"Create with 4 games\"."}] },
  ] },
  { title: "Profile and game page", href: "profile-game.html", sub: "Profile Lists · In N Game Lists · Add to list", surfaces: [
    { t: "4 · Profile Lists section", s: "Your own lists with the Private one; another member's Members-visible lists", o: [{"c": "4A", "n": "Box sets on the shelf", "d": "Each Game List is a fat spine on its own bookcase shelf beside the monumental count; the picked spine lifts and a pull-out shows its covers. Private is a dashed spine."}, {"c": "4B", "n": "A ledger of fans", "d": "One ruled row per list: a fan of five covers, the name in Anton, sort and update, a line of description and the count as an Anton numeral."}, {"c": "4C", "n": "Cover mosaics", "d": "Each list a 2 by 2 mosaic of its first covers, four across, numbered when Ranked; Private mosaics sit on black with a dashed edge; a dashed New list tile ends the row."}] },
    { t: "5 · Game page: In N Game Lists and Add to list", s: "Final Fantasy VI; the Franchise line becomes links and Collection becomes Series", o: [{"c": "5A", "n": "In the chip row", "d": "An outlined \"In 4 Game Lists\" chip in the hero's chip row opens the lists; a yellow Add to list on the hero's top line opens a checklist popover (a bottom sheet on the phone)."}, {"c": "5B", "n": "A block on the hero panel", "d": "\"In Game Lists\" becomes a fifth hero panel block with the count and owner marks; its Add opens a panel of on/off switches, one per list."}, {"c": "5C", "n": "Its own department", "d": "A full-width \"In Game Lists 4\" section: each list a card led by this game's place (\"No. 2 of 10\") with its neighbouring covers; Add to list opens an inline tray of toggles."}] },
  ] },
  { title: "Franchise page and edit tab", href: "franchise.html", sub: "/franchises/[id] · Franchises tab on /games/[id]/edit", surfaces: [
    { t: "6 · /franchises/[id]", s: "Mainline, Other and nested Add-ons; edit controls by role; history with Undo", o: [{"c": "6A", "n": "The annotated ledger", "d": "A numbered ruled row per game, Mainline then Other, Add-ons folded under their parent, the history in the right margin with Undo per line; Admins get a Franchise menu."}, {"c": "6B", "n": "The numbered run and the box set", "d": "Mainline as big covers with Roman numerals, Add-ons as paper inserts, Other in a box-set panel; Edit Franchise turns the page into an editor; history is its own section."}, {"c": "6C", "n": "The family tree by year", "d": "Release years down a central trunk, Mainline branching left at full size, Other right and small, Add-ons hanging off their parent; a Games / History view switch."}] },
    { t: "7 · Franchises tab on the Game Edit page", s: "Link, unlink and Mainline per Franchise; Series read-only", o: [{"c": "7A", "n": "Staged rows, Save all", "d": "One row per Franchise with a Mainline / Other control and Unlink; changes stage with Edited, Added and Removing marks and save through the Save all bar."}, {"c": "7B", "n": "Cards that save at once", "d": "Each Franchise a card with a Mainline star and an unlink x; every press saves at once with an Undo toast, outside Save all (breaks the page's staging rule on purpose)."}, {"c": "7C", "n": "Two columns, Mainline in and Other in", "d": "Drag a Franchise across, or press its arrow, to change whether this game is Mainline in it; new links land in Other; stages with Save all."}] },
  ] },
  { title: "Pool editor and Challenge page", href: "pool.html", sub: "Core and Optional · sources · proposals · list notices", surfaces: [
    { t: "8 · Pool editor (create and edit)", s: "Core and Optional, sources, linked list, the target, Left out; start from a list or a Franchise", o: [{"c": "8A", "n": "Two columns, one arrow", "d": "Core as a numbered ledger on the left, Optional as a cover wall on the right with sources and the target stepper; one arrow on every row moves a game across; Left out in a strip under both."}, {"c": "8B", "n": "One wall, a switch per tile", "d": "The shipped cover wall is the whole editor: each tile has a Core / Optional / Left out switch, Core tiles ringed in the tint's hi, a filter narrows to one kind."}, {"c": "8C", "n": "The sentence runs it", "d": "Core and Optional are words in the rule sentence (\"Clear all 14 Core Games and 2 of the 12 Optional Games\"); opening a word unfolds its ledger, wall or target under the panel."}] },
    { t: "9 · Challenge page", s: "Core and Optional with new tags, Made from, Pool Proposals, list notices, Core x/y and Optional a/N", o: [{"c": "9A", "n": "A third word on the switch", "d": "\"Proposals 3\" is a third view for the Host or staff, with list notices at its top; The Pool is two walls, Core then Optional."}, {"c": "9B", "n": "An in-tray above the switch", "d": "The Host gets Staff-desk in-tray cards (Pool Proposals, List notices) and decides in place; The Pool is one wall split by a rule, Core above, Optional below."}, {"c": "9C", "n": "Slips on the banner, Core as a checklist", "d": "Proposals and list notices are notice slips pinned on the banner; The Pool reads as a run sheet, Core a numbered checklist with your status, Optional a wall beside it."}] },
  ] },
];
const DECIDED = ["<b>Lists live in the Games group</b> of the sidebar as \"Lists\" (pinnable), and Franchise pages under Games too.", "<b>Date added runs newest first</b> on a Game List sorted by date added.", "<b>A game added to a Ranked list lands at the bottom</b> (\"No. 5 of 5\").", "<b>\"In N Game Lists\" counts only lists the viewer can see</b>; other members' Private lists never count.", "<b>A taken-over list shows \"from Grindlord\"</b> using taken_over_from_user_id.", "<b>Another member's profile with no lists shows no Lists section</b> (the Empty Track Rule); your own shows the empty state with New list.", "<b>Series is plain text</b>: there is no Series page, so the value never links.", "<b>Members see a Franchise's history read-only</b>, without Undo. Undone rows read \"undone by Rowan\", which needs the API to record who undid it.", "<b>\"Also add to the list?\" sits inside the Accept dialog</b> of a Pool Proposal, not as a second prompt.", "<b>Start from this Franchise brings XI and XIV in as Core</b> because they are Mainline; the Host switches them to Left out. Confirm that is the intended flow.", "<b>The target error shows as soon as the stepper passes the Optional count</b>, not only on save.", "<b>List notices are page-only</b>; they don't DM the Host.", "<b>No emoji, no new ink.</b> Yellow stays your own business, signal orange stays Delete and the takeover, the Challenge tint stays on Challenge surfaces."];
const ic = (n) => `<i data-lucide="${n}"></i>`;
const root = document.getElementById("root");
root.innerHTML = `<h1>Game Lists: website options</h1>
<p class="lede">The /impeccable options pass for <b>spec api#442</b> (www#168): <b>Game Lists</b>, <b>Franchise pages</b> and the <b>Core and Optional Pool</b> with <b>Pool Proposals</b>. Pick one option per surface, or mix them ("2B's ledger with 2D's notes"). Every option is drawn at desktop (1280) and phone (390) width, with its key states under it, and carries its own idea through every control. Real content throughout: <b>Fall of Final Fantasy</b> (I to XVI minus XI and XIV as Core Games, spin-offs as Optional Games), Grindlord's <b>Soulslike</b> list (Nioh 1 and 2, Wo Long, Wuchang, Black Myth: Wukong, Lies of P) and Mara's ranked <b>Top 10 of all time</b>. The bot's messages are in their own gallery at <a href="../game-lists-bot/index.html"><b>../game-lists-bot/</b></a>.</p>
<div class="gx-keys"><span>Today <b>Tue 24 Nov 2026</b></span><span>Viewer <b>Mara, a Regular</b></span><span>Members <b>invented</b></span><span>Art <b>Steam covers; Anton fallback where a game has none</b></span><span>Game Lists <b>a Feature in Preview</b></span></div>
${GROUPS.map((g) => `<section class="grp"><h2><a href="${g.href}">${g.title}</a><small>${g.sub}</small><a class="open" href="${g.href}">Open the options ${ic("arrow-right")}</a></h2>
<div class="sfs">${g.surfaces.map((s) => `<div class="sf"><h3>${s.t}</h3><p class="sub">${s.o.length} options · ${s.s}</p>
<div class="thumbs" style="--n:${Math.min(s.o.length, 4)}">${s.o.map((o) => `<a href="${g.href}#o${o.c.toLowerCase()}"><img src="png/${o.c.toLowerCase()}-desk.png" alt="Option ${o.c}" loading="lazy"><b>${o.c}</b></a>`).join("")}</div>
<ul class="ol">${s.o.map((o) => `<li><a href="${g.href}#o${o.c.toLowerCase()}">${o.c}</a><span><b>${o.n}.</b> ${o.d}</span></li>`).join("")}</ul></div>`).join("")}</div></section>`).join("")}
<section class="grp"><h2><a href="../game-lists-bot/index.html">The bot</a><small>/challenge Pool wizard · proposals and DMs · /list</small></h2>
<div class="botcard"><p>The <b>/challenge</b> Pool wizard steps, the <b>Pool Proposals</b> inbox and its three DMs, and <b>/list view</b> with the <b>Add to list</b> flow, drawn as Discord messages in their own gallery.</p><a class="btn hl" href="../game-lists-bot/index.html">Open the bot options ${ic("arrow-right")}</a></div></section>
<section class="decided"><h2>Already decided in these mocks<small>Say if any is wrong</small></h2><ul>${DECIDED.map((d) => `<li>${d}</li>`).join("")}</ul></section>`;
lucide.createIcons();
</script></body></html>
