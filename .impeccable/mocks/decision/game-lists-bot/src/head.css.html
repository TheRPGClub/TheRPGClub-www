<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Challenges Bot Options</title>
<meta name="description" content="Design options for the Challenges messages in the club's Discord bot.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0b0d;--ink-2:#141417;--ink-3:#1d1d22;--rule:#2a2a31;--rule-strong:#3a3a43;
  --paper:#f4f4f0;--paper-dim:#b9b9b2;--paper-mute:#8d8d87;--hl:#ffd400;--hl-ink:#3a3200;
  /* Discord classic dark */
  --dc-chat:#313338;--dc-2:#2b2d31;--dc-3:#1e1f22;--dc-border:#3f4147;--dc-text:#dbdee1;--dc-head:#f2f3f5;
  --dc-mute:#949ba4;--dc-sub:#b5bac1;--dc-blurple:#5865f2;--dc-link:#00a8fc;--dc-green:#248046;--dc-red:#da373c;--dc-grey:#4e5058;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink);scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--ink);color:var(--paper);font:400 16px/1.5 Barlow,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
::selection{background:var(--hl);color:var(--ink)}
a{color:inherit}
:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--rule-strong);border-radius:2px}::-webkit-scrollbar-track{background:var(--ink)}

/* ---------- shell ---------- */
.mast{padding:56px clamp(16px,4vw,48px) 28px;max-width:1680px;margin:0 auto}
.mast h1{font:400 clamp(2.6rem,6vw,4.6rem)/.9 Anton,Impact,sans-serif;text-transform:uppercase;margin:0;letter-spacing:.005em;padding-bottom:14px;border-bottom:2px solid var(--paper);text-wrap:balance}
.mast h1 b{font-weight:400;color:var(--hl)}
.mast .lede{max-width:72ch;color:var(--paper-dim);margin:18px 0 0;font-size:1.06rem}
.mast .lede strong{color:var(--paper);font-weight:600}
.keys{display:flex;flex-wrap:wrap;gap:8px 24px;margin:18px 0 0;padding:0;list-style:none;font:700 .82rem/1.3 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.07em;color:var(--paper-mute)}
.keys li span{color:var(--paper)}
nav.toc{position:sticky;top:0;z-index:20;background:rgba(11,11,13,.94);border-bottom:1px solid var(--rule);backdrop-filter:saturate(1.2)}
nav.toc ol{list-style:none;margin:0 auto;padding:0 clamp(16px,4vw,48px);display:flex;gap:2px;overflow-x:auto;max-width:1680px;scrollbar-width:none}
nav.toc a{display:block;padding:14px 12px 12px;font:700 .9rem/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.07em;color:var(--paper-dim);text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent}
nav.toc a b{font-family:Anton,Impact,sans-serif;font-weight:400;color:var(--paper);margin-right:6px;letter-spacing:0}
nav.toc a:hover{color:var(--hl);border-bottom-color:var(--hl)}
main{max-width:1680px;margin:0 auto;padding:0 clamp(16px,4vw,48px) 96px}
section.type{padding-top:56px}
.type-h{display:flex;align-items:flex-end;gap:18px;border-bottom:2px solid var(--paper);padding-bottom:10px}
.type-h .num{font:400 5rem/.8 Anton,Impact,sans-serif;color:var(--paper)}
.type-h h2{font:400 clamp(1.8rem,3.4vw,2.6rem)/.95 Anton,Impact,sans-serif;text-transform:uppercase;margin:0}
.type-brief{color:var(--paper-dim);max-width:72ch;margin:12px 0 28px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,640px),1fr));gap:40px 40px;align-items:start}
.opt{min-width:0}
.opt.wide{grid-column:1/-1}
.opt.wide .frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr));gap:0 40px;align-items:start}
.opt-h{display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--rule-strong);padding-bottom:8px}
.opt-h .code{font:400 2.4rem/.85 Anton,Impact,sans-serif;color:var(--hl)}
.opt-h h3{margin:0;font:800 1.2rem/1.1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.06em}
.idea{margin:10px 0 16px;color:var(--paper);max-width:68ch}
.notes{margin:14px 0 0;padding:0;list-style:none;color:var(--paper-dim);font-size:.94rem;max-width:68ch}
.notes li{padding:6px 0;border-top:1px solid var(--rule)}
.frame{margin:0 0 18px}
.frame-cap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:baseline;font:700 .78rem/1.3 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--paper-mute);margin:0 0 6px}
.frame-cap .what{color:var(--paper-dim)}
.budget{white-space:normal;text-align:right}
.budget.warn{color:#ff9d4d}

/* ---------- discord ---------- */
.dc{background:var(--dc-chat);border-radius:8px;overflow:hidden;font:400 16px/1.375 "Noto Sans","gg sans","Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--dc-text);box-shadow:0 1px 0 rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.35)}
.dc-top{height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid #26282c;box-shadow:0 1px 2px rgba(0,0,0,.2);font-weight:600;color:var(--dc-head);font-size:15px}
.dc-top svg{width:20px;height:20px;color:#80848e}
.dc-chat{padding:4px 0 18px;overflow-x:auto}
.msg{padding:0 16px;margin-top:16px}
.msg.cont{margin-top:4px}
.m-row{display:flex;gap:16px;align-items:flex-start}
.bot-av{width:40px;height:40px;flex:none;display:inline-block}
.bot-av svg{width:100%;height:100%;display:block;background:#18191c;border-radius:50%}
.bot-av.sm{width:16px;height:16px}
.m-gap{width:40px;flex:none}
.m-body{flex:1;min-width:0}
.m-head{display:flex;align-items:center;gap:0;margin-bottom:2px;line-height:22px}
.m-name{font-weight:500;color:var(--dc-head)}
.app{display:inline-flex;align-items:center;gap:1px;margin-left:4px;height:15px;padding:0 4px 0 2px;border-radius:3px;background:var(--dc-blurple);color:#fff;font-size:10px;font-weight:600;line-height:15px}
.app svg{width:13px;height:13px}
.m-time{margin-left:8px;font-size:12px;color:var(--dc-mute)}
.m-ref{position:relative;display:flex;align-items:center;gap:4px;padding-left:56px;margin-bottom:4px;font-size:14px;color:var(--dc-sub);line-height:18px}
.m-ref .spine{position:absolute;left:36px;top:9px;width:18px;height:12px;border-left:2px solid #4e5058;border-top:2px solid #4e5058;border-top-left-radius:6px}
.m-ref .ref-n{color:var(--dc-head);font-weight:500}
.m-ref .ref-cmd{color:var(--dc-link)}
.m-ref .ref-txt{color:var(--dc-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref-av{margin-right:2px}
.m-comps{display:flex;flex-direction:column;gap:8px;max-width:600px}
.m-edited{font-size:10px;color:var(--dc-mute);margin-top:2px}
.m-eph{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--dc-mute)}
.m-eph svg{width:16px;height:16px}
.m-reacts{display:flex;gap:4px;margin-top:6px}
.react{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:8px;background:var(--dc-2);border:1px solid transparent;font-size:14px;font-weight:600;color:var(--dc-sub)}
.react.me{background:rgba(88,101,242,.15);border-color:var(--dc-blurple);color:#c9cdfb}
.r-e{font-size:16px;line-height:1}
.m-thread{display:flex;align-items:center;gap:8px;margin-top:8px;max-width:480px;padding:8px 12px;border-radius:8px;background:var(--dc-2);font-size:14px}
.m-thread svg{width:18px;height:18px;color:var(--dc-sub)}
.t-n{font-weight:600;color:var(--dc-head)}
.t-c{margin-left:auto;color:var(--dc-link);font-weight:600}

.av{display:inline-grid;place-items:center;width:var(--s);height:var(--s);border-radius:50%;background:var(--av);color:#101012;font:700 calc(var(--s)*.5)/1 "Noto Sans",sans-serif;flex:none;vertical-align:middle}
.m-av,.ref-av,.b-av,.d-emo{display:inline-grid;place-items:center;width:var(--s);height:var(--s);border-radius:50%;background:var(--av);color:#101012;font:700 calc(var(--s)*.5)/1 "Noto Sans",sans-serif;flex:none}
.d-emo{width:1.375em;height:1.375em;font-size:inherit;vertical-align:-.3em;font-size:.95em}
.d-emo{font-size:11px}
.cv-text .d-emo{width:22px;height:22px;font-size:11px}

/* components v2 */
.cv-ctr{background:var(--dc-2);border:1px solid #3a3c42;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cv-ctr.acc{box-shadow:inset 4px 0 0 var(--accent);padding-left:20px}
.cv-text{min-width:0;overflow-wrap:anywhere}
.cv-section{display:flex;gap:12px;align-items:flex-start}
.cv-sec-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.cv-acc{flex:none;display:flex}
.cv-thumb .cov{width:64px;height:85px;border-radius:8px}
.cv-sep{height:0}
.cv-sep.div{border-top:1px solid #3f4147;margin:4px 0}
.cv-sep.lg{margin:12px 0}
.cv-row{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.cv-gallery{display:grid;gap:4px;border-radius:8px;overflow:hidden;max-width:100%}
.cv-gallery .g-item{position:relative;overflow:hidden;background:#111214;aspect-ratio:1}
.cv-gallery.n1 .g-item{aspect-ratio:auto}
.cv-gallery.n2,.cv-gallery.n4{grid-template-columns:1fr 1fr}
.cv-gallery.n3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
.cv-gallery.n3 .g-item:first-child{grid-row:span 2;aspect-ratio:auto}
.cv-gallery.n6,.cv-gallery.n9{grid-template-columns:repeat(3,1fr)}
.cv-gallery.n5,.cv-gallery.n8{grid-template-columns:repeat(6,1fr)}
.cv-gallery.n5 .g-item,.cv-gallery.n8 .g-item{grid-column:span 2}
.cv-gallery.n5 .g-item:nth-child(-n+2),.cv-gallery.n8 .g-item:nth-child(-n+2){grid-column:span 3;aspect-ratio:3/2}
.cv-gallery.n7,.cv-gallery.n10{grid-template-columns:repeat(3,1fr)}
.cv-gallery.n7 .g-item:first-child,.cv-gallery.n10 .g-item:first-child{grid-column:span 3;aspect-ratio:16/7}
.cv-gallery .gen{width:100%}
.cv-gallery.n1 .g-item.gen{aspect-ratio:auto!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;border-radius:8px;font:500 14px/16px "Noto Sans",sans-serif;color:#fff;background:var(--dc-grey);white-space:nowrap;user-select:none}
.btn.primary{background:var(--dc-blurple)}
.btn.success{background:var(--dc-green)}
.btn.danger{background:var(--dc-red)}
.btn.link{background:var(--dc-grey)}
.btn.ghost{background:transparent}
.btn.disabled{opacity:.5}
.b-ext{width:16px;height:16px}
.b-av{margin-left:-4px}

/* selects */
.sel{width:100%;max-width:100%;position:relative}
.sel-box{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 12px;background:var(--dc-3);border:1px solid var(--dc-3);border-radius:8px;font-size:15px;color:var(--dc-text)}
.sel .ph{color:var(--dc-mute)}
.sel .chev{width:20px;height:20px;color:var(--dc-sub)}
.sel.open .sel-box{border-radius:8px 8px 0 0;border-color:#111214}
.sel-menu{background:var(--dc-2);border:1px solid #111214;border-top:0;border-radius:0 0 8px 8px;padding:4px 0;max-height:none}
.sopt{display:flex;gap:10px;align-items:center;padding:7px 12px;margin:0 4px;border-radius:4px}
.sel-menu .sopt.on{background:#404249}
.o-txt{display:flex;flex-direction:column;min-width:0}
.o-l{color:var(--dc-text);font-size:15px;line-height:20px}
.o-d{color:var(--dc-sub);font-size:13px;line-height:16px}
.chk{width:20px;height:20px;border-radius:4px;border:2px solid #b5bac1;flex:none;position:relative}
.chk.on{background:var(--dc-blurple);border-color:var(--dc-blurple)}
.chk.on::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}

/* markdown */
.d-h1{font-size:24px;line-height:1.25;font-weight:700;color:var(--dc-head);margin:2px 0 4px}
.d-h2{font-size:20px;line-height:1.3;font-weight:700;color:var(--dc-head);margin:2px 0 4px}
.d-h3{font-size:16px;line-height:1.375;font-weight:700;color:var(--dc-head);margin:2px 0 2px}
.d-h1+.d-h1,.d-line+.d-h3,.d-ol+.d-h3,.d-line+.d-h2{margin-top:10px}
.d-sub{font-size:13px;line-height:1.35;color:var(--dc-mute)}
.d-sub .d-mention,.d-sub .d-time{font-size:13px}
.d-blank{height:10px}
.d-quote{margin:2px 0;padding:0 8px 0 12px;border-left:4px solid #4e5058;border-radius:4px}
.d-ul,.d-ol{margin:2px 0 2px;padding-left:24px}
.d-ol li::marker{color:var(--dc-text)}
.d-pre{margin:4px 0;background:var(--dc-3);border:1px solid #1a1b1e;border-radius:4px;padding:8px 10px;font:14px/1.3 "Noto Sans Mono",Consolas,"Andale Mono",monospace;color:var(--dc-text);overflow-x:auto;white-space:pre}
.d-code{background:var(--dc-3);border-radius:4px;padding:.1em .3em;font:.85em/1 "Noto Sans Mono",Consolas,monospace}
.d-mention{background:rgba(88,101,242,.3);color:#c9cdfb;font-weight:500;border-radius:3px;padding:0 2px}
.d-mention.chan::before{content:"# ";opacity:.8}
.d-time{background:rgba(78,80,88,.48);border-radius:3px;padding:0 2px}
.d-link{color:var(--dc-link);text-decoration:none}
strong{font-weight:700;color:inherit}
.sq{display:inline-block;width:1.1em;height:1.1em;border-radius:3px;vertical-align:-.18em;margin:0 1px}
.sq.g{background:#78b159}.sq.y{background:#fdcb58}.sq.k{background:#31373d;box-shadow:inset 0 0 0 1px #4a5058}.sq.w{background:#e6e7e8}.sq.b{background:#55acee}

/* covers (stand-ins for IGDB art) */
.cov{position:relative;display:block;width:100%;aspect-ratio:3/4;overflow:hidden;background:
  radial-gradient(120% 80% at 70% 15%,color-mix(in srgb,var(--c2) 55%,transparent),transparent 60%),
  linear-gradient(165deg,var(--c1) 0%,color-mix(in srgb,var(--c1) 70%,#000) 100%)}
.cov::before{content:"";position:absolute;left:50%;top:38%;width:46%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg);border:2px solid color-mix(in srgb,var(--c2) 80%,transparent);opacity:.55}
.cov::after{content:"";position:absolute;inset:5px;border:1px solid rgba(255,255,255,.12)}
.cov.fill{height:100%;aspect-ratio:auto}
.cov-t{position:absolute;left:0;right:0;bottom:0;padding:16px 7px 7px;background:linear-gradient(transparent,rgba(0,0,0,.78));font:700 11px/1.05 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;color:#fff}
.gift-thumb{display:block;width:64px;height:85px;border-radius:8px;background:#1f4d36;position:relative;overflow:hidden}
.gift-thumb::before{content:"";position:absolute;left:28px;top:0;bottom:0;width:8px;background:#e8c35a}
.gift-thumb::after{content:"";position:absolute;top:36px;left:0;right:0;height:8px;background:#e8c35a}
.strip{display:flex;gap:6px;padding:10px;background:#0d0d10}
.strip .cov{flex:1;min-width:0}
.strip.fill{height:100%;align-items:center}

/* generated images, in the club's print style */
.yp{background:#0b0b0d;color:var(--paper);padding:14px 14px 10px;font-family:Barlow,sans-serif;height:100%}
.yp.mini{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;align-items:stretch;padding:10px}
.yp-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--paper);padding-bottom:6px;margin-bottom:8px}
.yp-name{font:400 26px/.9 Anton,Impact,sans-serif;text-transform:uppercase}
.yp-cap{font:700 11px/1.2 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--paper-dim);margin-top:4px}
.yp-num{font:400 40px/.8 Anton,Impact,sans-serif}
.yp-num span{font-size:20px;color:var(--paper-mute)}
.yp-row{display:grid;grid-template-columns:38px repeat(10,1fr);gap:3px;margin-bottom:3px;align-items:stretch}
.yp-d{font:700 11px/1 "Barlow Condensed",sans-serif;letter-spacing:.06em;color:var(--paper-mute);align-self:center}
.yp-t{position:relative;aspect-ratio:3/4;border-radius:2px;overflow:hidden;display:block}
.yp-t b{position:absolute;left:3px;bottom:2px;font:400 11px/1 Anton,Impact,sans-serif;color:#fff;text-shadow:0 1px 2px #000}
.yp-t.open{border:1.5px dashed var(--rule-strong)}
.yp-t.open b{color:var(--paper-mute);text-shadow:none}
.yp.mini .yp-t b{font-size:13px;left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%)}
.yp-t.ip{border:1.5px solid var(--paper-dim);background:repeating-linear-gradient(135deg,#1d1d22 0 4px,#26262c 4px 8px)}
.yp-t.ip i{position:absolute;top:3px;left:0;right:0;text-align:center;font:700 7px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--paper);font-style:normal}
.yp-t.void{visibility:hidden}
.yp-key{display:flex;gap:14px;margin-top:8px;font:700 10px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.07em;color:var(--paper-mute)}
.yp-key span{display:inline-flex;gap:5px;align-items:center}
.yp-key .k{display:inline-block;width:9px;height:12px;border-radius:1px}
.yp-key .k.on{background:#5a7fa0}.yp-key .k.ip{border:1.5px solid var(--paper-dim)}.yp-key .k.open{border:1.5px dashed var(--rule-strong)}.yp-key .k.ipo{border:1.5px solid var(--hl)}
.st{background:#0b0b0d;color:var(--paper);padding:14px;height:100%}
.st-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--paper);padding-bottom:6px;margin-bottom:6px;font:400 20px/1 Anton,Impact,sans-serif;text-transform:uppercase}
.st-head span+span{font:700 11px/1 "Barlow Condensed",sans-serif;letter-spacing:.08em;color:var(--paper-dim)}
.st-row{display:grid;grid-template-columns:96px 1fr 62px;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--rule)}
.st-n{font:700 12px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:5px}
.st-n::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--av)}
.st-cells{display:flex;gap:3px}
.st-c{width:21px;aspect-ratio:3/4;border-radius:2px;overflow:hidden;display:block}
.st-c.open{border:1.5px dashed var(--rule-strong)}
.st-c.ip{outline:1.5px solid var(--hl);outline-offset:-1.5px;opacity:.75}
.st-tag{font:400 13px/1 Anton,Impact,sans-serif;text-align:right;color:var(--paper-dim)}
.st-row.finished .st-tag{color:var(--paper)}
.st-row.abandoned{opacity:.45}
.gt{background:#0e1712;color:var(--paper);padding:14px;height:100%}
.gt-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #e8c35a;padding-bottom:6px;margin-bottom:10px;font:400 22px/1 Anton,Impact,sans-serif;text-transform:uppercase}
.gt-head span+span{font:700 11px/1 "Barlow Condensed",sans-serif;letter-spacing:.08em;color:#e8c35a}
.gt-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 8px}
.gt-c{min-width:0}.gt-c .cov{border-radius:2px}
.gt-tag{margin-top:4px;display:inline-flex;gap:4px;align-items:baseline;background:#e8c35a;color:#1a1400;padding:2px 5px;border-radius:2px;font:800 10px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;max-width:100%;overflow:hidden;white-space:nowrap}
.gt-tag span{font-weight:600;opacity:.7}
.gt-g{font:600 9px/1.15 "Barlow Condensed",sans-serif;text-transform:uppercase;color:var(--paper-dim);margin-top:3px;letter-spacing:.03em}

/* modal */
.modal-wrap{background:rgba(0,0,0,.72);padding:28px 16px;display:flex;justify-content:center}
.modal{width:min(100%,460px);background:var(--dc-chat);border-radius:10px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.mo-head{display:flex;align-items:center;gap:8px;padding:16px 16px 8px}
.mo-head .bot-av.sm{width:24px;height:24px}
.mo-t{font-size:20px;font-weight:700;color:var(--dc-head);flex:1}
.mo-x{color:var(--dc-sub);font-size:24px;line-height:1}
.mo-body{padding:8px 16px 16px;display:flex;flex-direction:column;gap:18px}
.ml-l{font-size:15px;font-weight:600;color:var(--dc-head);margin-bottom:2px}
.ml-d{font-size:13px;color:var(--dc-sub);margin-bottom:6px}
.ml-l+.ti,.ml-l+.rg,.ml-l+.sel{margin-top:6px}
.req{color:#f23f43;margin-left:4px}
.ti{background:var(--dc-3);border:1px solid var(--dc-3);border-radius:8px;padding:9px 12px;font-size:15px;color:var(--dc-text);position:relative}
.ti.para{min-height:84px;padding-bottom:22px}
.ti.ph{color:#6d6f78}
.ti-count{position:absolute;right:10px;bottom:4px;font-size:11px;color:var(--dc-mute)}
.rg{display:flex;flex-direction:column;gap:6px}
.rg-row{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--dc-2);border:1px solid transparent}
.rg-row.on{border-color:var(--dc-blurple);background:rgba(88,101,242,.1)}
.rg-dot{width:20px;height:20px;border-radius:50%;border:2px solid #b5bac1;flex:none;position:relative}
.rg-row.on .rg-dot{border-color:var(--dc-blurple)}
.rg-row.on .rg-dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--dc-blurple)}
.mo-foot{background:var(--dc-2);padding:14px 16px;display:flex;justify-content:flex-end;gap:8px}
.mt{color:var(--dc-text)}

/* autocomplete */
.ac{padding:28px 16px 6px}
.ac-pop{background:var(--dc-2);border:1px solid #111214;border-radius:8px;padding:6px 0;margin-bottom:8px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.ac-h{font-size:12px;font-weight:700;color:var(--dc-sub);letter-spacing:.02em;padding:4px 12px 8px}
.ac-row{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;margin:0 6px;border-radius:4px}
.ac-row.on{background:#404249}
.ac-l{color:var(--dc-head)}
.ac-d{color:var(--dc-sub);font-size:14px;white-space:nowrap}
.cbar{min-height:44px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:8px 14px;background:#383a40;border-radius:8px}
.cb-cmd{font-weight:600;color:var(--dc-head);margin-right:4px}
.cb-opt{display:inline-flex;border-radius:4px;overflow:hidden;font-size:14px;line-height:22px}
.cb-opt .k{background:#4e5058;color:var(--dc-sub);padding:0 6px}
.cb-opt .v{background:#2b2d31;color:var(--dc-head);padding:0 6px;display:inline-flex;align-items:center}
.cb-opt.focus{box-shadow:0 0 0 1px var(--dc-link)}
.caret{display:inline-block;width:1px;height:16px;background:var(--dc-head);margin-left:1px}

@media (max-width:560px){
  .msg{padding:0 10px}.m-row{gap:10px}.bot-av,.m-gap{width:32px;height:32px}
  .m-ref{padding-left:44px}.m-ref .spine{left:26px}
  .type-h .num{font-size:3.6rem}
  .btn{padding:0 10px}
}
@media (prefers-reduced-motion:no-preference){
  .caret{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
}
